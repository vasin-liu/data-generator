# 数据集名称，各个文件中唯一
name: etm_training_plan_item
# 迭代器配置
iterator:
  type: NUMBER
  from: 1
  to: 100
  step: 1
# 生成器配置
generator:
  type: ASYNC
  batchSize: 10
  executor:
    coreSize: 8
    maxSize: 16
    queueCapacity: 8
# 数据集元数据配置
fields:
  - name: ID
    stages:
      - type: READ
        readers:
          - type: DIRECT_SPEL
            dataSet: "#faker.snowflake.next"
  - name: PLAN_ID
    stages:
      - type: READ
        readers:
          - type: JDBC
            dataSourceId: 'tocc_training'
            dataSet: "SELECT ID FROM etm_training_plan WHERE STATUS = 'SOA'"
  - name: TRAINING_THEME
    stages:
      - type: READ
        readers:
          - type: CONSTANT
            dataSet: [1,2,3]
  - name: TRAINING_CONTENT
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: DIRECT_SPEL
            dataSet: "#faker.common.text(15,20)"
  - name: TRAINING_TYPE
    stages:
      - type: READ
        readers:
          - type: CONSTANT
            dataSet: [1,2,3]
  - name: TRAINING_TARGET
    stages:
      - type: READ
        readers:
          - type: CONSTANT
            dataSet: [1,2,3]
  - name: START_TIME
    stages:
      - type: READ
        readers:
          - type: DIRECT_SPEL
            dataSet: >-
              #faker.expression("#{date.past '9','DAYS','yyyy-MM-dd HH:mm:ss'}")
  - name: END_TIME
    stages:
      - type: READ
        readers:
          - type: DIRECT_SPEL
            dataSet: >-
              #faker.expression("#{date.past '2','DAYS','yyyy-MM-dd HH:mm:ss'}")
  - name: STATUS
    stages:
      - type: READ
        readers:
          - type: CONSTANT
            dataSet: [ 0,1,2,3 ]
      - type: SELECT
  - name: CREATE_TIME
    stages:
      - type: READ
        readers:
          - type: DIRECT_SPEL
            dataSet: >-
              #faker.expression("#{date.past '1','DAYS','yyyy-MM-dd HH:mm:ss'}")
  - name: CREATE_BY
    stages:
      - type: READ
        readers:
          - type: CONSTANT
            dataSet: 'admin'
  - name: CREATE_BY_NAME
    stages:
      - type: READ
        readers:
          - type: CONSTANT
            dataSet: '系统管理员'
  - name: UPDATE_TIME
    stages:
      - type: READ
        readers:
          - type: DIRECT_SPEL
            dataSet: >-
              #faker.expression("#{date.past '1','DAYS','yyyy-MM-dd HH:mm:ss'}")
  - name: UPDATE_BY
    stages:
      - type: READ
        readers:
          - type: CONSTANT
            dataSet: 'admin'

output:
  writers:
    - writerType: CONSOLE
    - writerType: JDBC
      dataSourceId: 'tocc_training'
      target: 'etm_training_plan_item_2'
      template: "ID,PLAN_ID,TRAINING_THEME,TRAINING_CONTENT,TRAINING_TYPE,TRAINING_TARGET,START_TIME,END_TIME,STATUS,CREATE_TIME,CREATE_BY,CREATE_BY_NAME,UPDATE_TIME,UPDATE_BY"