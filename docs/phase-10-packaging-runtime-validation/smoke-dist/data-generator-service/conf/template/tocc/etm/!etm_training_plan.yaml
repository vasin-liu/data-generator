# 数据集名称，各个文件中唯一
name: etm_training_plan
# 迭代器配置
iterator:
  type: NUMBER
  from: 1
  to: 100
  step: 1
# 生成器配置
generator:
  type: ASYNC
  batchSize: 10
  executor:
    coreSize: 8
    maxSize: 16
    queueCapacity: 8
# 数据集元数据配置
fields:
  - name: ID
    stages:
      - type: READ
        readers:
          - type: DIRECT_SPEL
            dataSet: "#faker.snowflake.next"
  - name: PLAN_NAME
    stages:
      - type: READ
        readers:
          - type: DIRECT_SPEL
            dataSet: "#faker.common.text(5,10)"
  - name: PLAN_YEAR
    stages:
      - type: READ
        readers:
          - type: CONSTANT
            dataSet: 2024
  - name: DISTRICT_CODE
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: JDBC
            dataSourceId: 'system_manage'
            dataSet: "SELECT CODE,NAME FROM pc_district WHERE PARENT_CODE='440100' ORDER BY CODE"
      - type: SELECT
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset.CODE"
  - name: DISTRICT_NAME
    dependsOn:
      - DISTRICT_CODE
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset.NAME"
  - name: ENTERPRISE_TYPE
    stages:
      - type: READ
        readers:
          - type: CONSTANT
            dataSet: [ 1,2,3,4 ]
      - type: SELECT
  - name: TRAINING_GOAL
    stages:
      - type: READ
        readers:
          - type: DIRECT_SPEL
            dataSet: "#faker.common.text(15,20)"
  - name: TRAINING_PURPOSE
    stages:
      - type: READ
        readers:
          - type: DIRECT_SPEL
            dataSet: "#faker.common.text(15,20)"
  - name: START_TIME
    stages:
      - type: READ
        readers:
          - type: DIRECT_SPEL
            dataSet: >-
              #faker.expression("#{date.past '10','DAYS','yyyy-MM-dd HH:mm:ss'}")
  - name: END_TIME
    stages:
      - type: READ
        readers:
          - type: DIRECT_SPEL
            dataSet: >-
              #faker.expression("#{date.past '1','DAYS','yyyy-MM-dd HH:mm:ss'}")
  - name: PLAN_STATUS
    stages:
      - type: READ
        readers:
          - type: CONSTANT
            dataSet: [ 0,1,2,3 ]
  - name: STATUS
    stages:
      - type: READ
        readers:
          - type: CONSTANT
            dataSet: 'SOA'
      - type: SELECT
  - name: CREATE_TIME
    stages:
      - type: READ
        readers:
          - type: DIRECT_SPEL
            dataSet: >-
              #faker.expression("#{date.past '1','DAYS','yyyy-MM-dd HH:mm:ss'}")
  - name: CREATE_BY
    stages:
      - type: READ
        readers:
          - type: CONSTANT
            dataSet: 'admin'
  - name: CREATE_BY_NAME
    stages:
      - type: READ
        readers:
          - type: CONSTANT
            dataSet: '系统管理员'
  - name: UPDATE_TIME
    stages:
      - type: READ
        readers:
          - type: DIRECT_SPEL
            dataSet: >-
              #faker.expression("#{date.past '1','DAYS','yyyy-MM-dd HH:mm:ss'}")
  - name: UPDATE_BY
    stages:
      - type: READ
        readers:
          - type: CONSTANT
            dataSet: 'admin'

output:
  writers:
    - writerType: CONSOLE
    - writerType: JDBC
      dataSourceId: 'tocc_training'
      target: 'etm_training_plan_2'
      template: "ID,PLAN_NAME,PLAN_YEAR,DISTRICT_CODE,DISTRICT_NAME,ENTERPRISE_TYPE,TRAINING_GOAL,TRAINING_PURPOSE,START_TIME,END_TIME,PLAN_STATUS,CREATE_TIME,CREATE_BY,CREATE_BY_NAME,UPDATE_TIME,UPDATE_BY"