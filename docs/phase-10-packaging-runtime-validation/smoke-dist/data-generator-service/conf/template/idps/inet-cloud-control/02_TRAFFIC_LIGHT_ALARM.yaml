# 生成器配置
generator:
  type: ASYNC
  batchSize: 10
  executor:
    coreSize: 8
    maxSize: 16
    queueCapacity: 8
# 数据集元数据配置
fields:
  - name: ID
    stages:
      - type: READ
        readers:
          - type: SPEL
            content: "#faker.snowflake.next"
      - type: SELECT
  - name: LIGHT_ID
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content: [ '111111','222222','333333','444444','555555','666666','777777','888888','999999' ]
  - name: ALARM_TYPE
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content: [ 1,2,3,4,5 ]
  - name: ALARM_TIME
    stages:
      - type: READ
        readers:
          - type: SPEL
            content: >-
              #faker.datetime.now()
  - name: REPORT_TIME
    dependsOn:
      - ALARM_TIME
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset"
  - name: LONGITUDE
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset[0].get(0)"
  - name: LATITUDE
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset[0].get(1)"
  - name: STATUS
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content: [ 'S0A' ]
  - name: CREATE_TIME
    dependsOn:
      - ALARM_TIME
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset"
  - name: UPDATE_TIME
    dependsOn:
      - ALARM_TIME
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset"

