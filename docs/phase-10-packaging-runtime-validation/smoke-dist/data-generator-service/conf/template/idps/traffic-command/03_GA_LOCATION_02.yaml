  #暂停5秒再生成
  pause: 3
# 生成器配置
generator:
  type: SYNC
  batchSize: 1
# 数据集元数据配置
fields:
  - name: ID
    stages:
      - type: READ
        readers:
          - type: SPEL
            content: "#faker.snowflake.next"
      - type: SELECT
  - name: simid
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content: [ '73027302' ]
      - type: SELECT
  - name: altitude
    stages:
      - type: READ
        readers:
          - type: SPEL
            content: "#faker.number.numberBetween(0,20)"
  - name: latitude
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset[0][1]"
  - name: longitude
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset[0][0]"
  - name: recTime
    stages:
      - type: READ
        readers:
          - type: SPEL
            content: >-
              #faker.datetime.seconds()
  - name: svrTime
    stages:
      - type: READ
        readers:
          - type: SPEL
            content: >-
              #faker.datetime.seconds()
  - name: speed
    stages:
      - type: READ
        readers:
          - type: SPEL
            content: "#faker.number.numberBetween(40,60)"
      - type: SELECT
  - name: alarmFlag
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content: [ '0' ]
      - type: SELECT
  - name: terminalType
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content: [ '1' ]
      - type: SELECT
  - name: gas
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content: [ '0' ]
      - type: SELECT
  - name: course
    stages:
      - type: READ
        readers:
          - type: SPEL
            content: "#faker.number.numberBetween(40,300)"
      - type: SELECT
  - name: recordVelocity
    dependsOn:
      - speed
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset"
  - name: status
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content: [ '0' ]
  - name: mileage
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content: [ '0' ]
  - name: onlineState
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content: [ '0' ]
  - name: depId
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content: [ '' ]
  - name: depName
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content: [ '' ]
  - name: plateno
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content: [ '粤A7302警' ]
  - name: simno
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content: [ '73027302' ]

# 数据输出配置
output:
  writers:
    - type: CONSOLE
    - type: KAFKA
      dataSourceId: 'command_kafka'
      target: 'ga_location'
      template: >-
        {
          "simid": "${simid}",
          "altitude": "${altitude}",
          "latitude": "${latitude}",
          "longitude": "${longitude}",
          "recTime": "${recTime}",
          "svrTime": "${svrTime}",
          "speed": "${speed}",
          "alarmFlag": "${alarmFlag}",
          "terminalType": "${terminalType}",
          "gas": "${gas}",
          "course": "${course}",
          "recordVelocity": "${recordVelocity}",
          "status": "${status}",
          "mileage": "${mileage}",
          "onlineState": "${onlineState}",
          "depId": "${depId}",
          "depName": "${depName}",
          "plateno": "${plateno}",
          "simno": "${simno}"
        }
