# 数据集名称，各个文件中唯一
name: dtem_driving_school_license
#生成数量
amount: 100
#批次数量
batchSize: 10
#全局配置
global:
  #线程池配置
  executor:
    #核心线程数
    coreSize: 8
    #最大线程数
    maxSize: 16
    #队列大小
    queueCapacity: 16

# 数据集元数据配置
table:
  # 字段配置列表
  fields:
    #字段配置
    - #字段名
      name: ID
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.snowflake.next"
    - #字段名
      name: SCHOOL_ID
      converter: org.gensokyo.data.converter.LongConverter
      #后置脚本处理
      postScript:
        content: "#dataset.ID"
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: JDBC
          #数据源编号
          dataSourceId: 'tocc_driving_school'
          #数据集
          dataSet: "SELECT ID FROM DTEM_DRIVING_SCHOOL WHERE STATUS = 'S0A'"
    - #字段名
      name: RECORD_NO
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.snowflake.next"
    - #字段名
      name: RECORD_DATE
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: >-
            #faker.expression("#{date.past '1','DAYS','yyyy-MM-dd'}")
    - #字段名
      name: BUSINESS_LICENSE
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.snowflake.next"
    - #字段名
      name: ROAD_LICENSE
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.snowflake.next"
    - #字段名
      name: ROAD_LICENSE_DATE
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: >-
            #faker.expression("#{date.past '1','DAYS','yyyy-MM-dd'}")
    - #字段名
      name: ROAD_LICENSE_VALIDITY_DATE
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: >-
            #faker.expression("#{date.future '100','DAYS','yyyy-MM-dd'}")
    - #字段名
      name: APPROVAL_ID
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.snowflake.next"
    - #字段名
      name: APPROVAL_DEPT
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: CONSTANT
          #数据集
          dataSet: [ "440103","440104","440105","440106","440111","440112","440113","440114","440115","440117","440118" ]
    - #字段名
      name: STATUS
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: CONSTANT
          #数据集
          dataSet: [ "S0A" ]
    - #字段名
      name: CREATE_BY
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: CONSTANT
          #数据集
          dataSet: [ "admin" ]
    - #字段名
      name: UPDATE_BY
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: CONSTANT
          #数据集
          dataSet: [ "admin" ]
  writer:
    #目标数据集类型
    type: JDBC
    #数据源编号
    dataSourceId: 'tocc_driving_school'
    # 表名/索引名/主题名
    target: 'dtem_driving_school_license'
    #数据写入模板
    template: "ID, SCHOOL_ID, RECORD_NO, RECORD_DATE, BUSINESS_LICENSE, ROAD_LICENSE, ROAD_LICENSE_DATE, ROAD_LICENSE_VALIDITY_DATE, APPROVAL_ID, APPROVAL_DEPT, STATUS, CREATE_BY, UPDATE_BY"