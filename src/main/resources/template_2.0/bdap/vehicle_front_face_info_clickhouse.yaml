# 数据集名称，各个文件中唯一
name: vehicle_front_face_info_clickhouse
#生成数量
amount: 100000
#批次数量
batchSize: 10000
#全局配置
global:
  #线程池配置
  executor:
    #核心线程数
    coreSize: 8
    #最大线程数
    maxSize: 16
    #队列大小
    queueCapacity: 16

# 数据集元数据配置
table:
  # 字段配置列表
  fields:
    #字段配置
    - #虚拟字段用来处理依赖关系字段的数据集选择
      name: virtual_filed
      readers:
        - dataSetId: virtual_filed_ds
          type: CONSTANT
          # 1 普通小车；2 普通大车；3 香港车；4 澳门车；5 教练车；6 警车；7 挂车；
          dataSet: [ 1,2,3,4,5,6,7 ]
    - #字段名 信息主键编号
      name: INFO_ID
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: INFO_ID
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.snowflake.next"
    - #字段名 设备编号
      name: DEVICE_ID
      postScript:
        content: "#dataset.SXJSBBM"
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: DEVICE_ID
          type: JDBC
          #数据源编号
          dataSourceId: 'omof'
          #数据集
          dataSet: >-
            SELECT OVBI.KKBH,OVBI.KKMC,OVBI.KKDZ,OVBI.KKMC,OVBI.XZQH,OVBI.JSDW,OVBI.FXMS,OVBI.ZPFXLX,
            OVBI.DLMC,OVBI.JD,OVBI.WD,OLI.SXJSBBM,OLI.CDBH,OLI.CDLX 
            FROM OMOF_VEHICLE_BARRIER_INFO OVBI INNER JOIN OMOF_LANE_INFO OLI ON OVBI.KKBH = OLI.KKBH
    - #字段名 抓拍时间
      name: PASS_TIME
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: PASS_TIME
          type: DIRECT_SPEL
          #数据集
          dataSet: >-
            #faker.expression("#{date.past '1','DAYS','yyMMddHHmmss'}")
    - #字段名 号牌号码（二次识别）
      name: PLATE_NO
      dependsOn:
        - virtual_filed
      preScript:
        content: "#faker.vehicleCN.plate(#dataset['virtual_filed'])"
    - #字段名 号牌颜色（二次识别）
      name: PLATE_COLOR
      converter: org.gensokyo.data.converter.LongConverter
      dependsOn:
        - virtual_filed
      resultMapper:
        defaultDataset: [ 0 ]
        mappers:
          - key: "1"
            dataset: [ 0 ] #蓝色
          - key: "2"
            dataset: [ 2 ] #黄色
          - key: "3"
            dataset: [ 1 ] #黑色
          - key: "4"
            dataset: [ 1 ] #黑色
          - key: "5"
            dataset: [ 2 ] #黄色
          - key: "6"
            dataset: [ 3 ] #白色
          - key: "7"
            dataset: [ 2 ] #黄色
    - #字段名 号牌种类（二次识别）
      name: PLATE_CLASS
      dependsOn:
        - virtual_filed
      resultMapper:
        defaultDataset: [ 0 ]
        mappers:
          - key: "1"
            dataset: [ 2 ]
          - key: "2"
            dataset: [ 1 ]
          - key: "3"
            dataset: [ 26 ]
          - key: "4"
            dataset: [ 27 ]
          - key: "5"
            dataset: [ 2 ]
          - key: "6"
            dataset: [ 23 ]
          - key: "7"
            dataset: [ 1 ]
    - #字段名 过车车速
      name: SPEED
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: SPEED
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.number.numberBetween(60,120)"
    - #字段名 原始设备编号
      name: ORIGINAL_DEVICE_ID
      #数据集列表
      dependsOn:
        - DEVICE_ID
      postScript:
        content: "#dataset.SXJSBBM"
    - #字段名 抓拍地点
      name: DEVICE_ADDR
      #数据集列表
      dependsOn:
        - DEVICE_ID
      postScript:
        content: "#dataset.KKDZ"
    - #字段名 卡口编号
      name: TOLLGATE_ID
      #数据集列表
      dependsOn:
        - DEVICE_ID
      postScript:
        content: "#dataset.KKBH"
    - #字段名 原始卡口编号
      name: ORIGINAL_TOLLGATE_ID
      #数据集列表
      dependsOn:
        - DEVICE_ID
      postScript:
        content: "#dataset.KKBH"
    - #字段名 卡口名称
      name: TOLLGATE_NAME
      #数据集列表
      dependsOn:
        - DEVICE_ID
      postScript:
        content: "#dataset.KKMC"
    - #字段名 主驾人脸视图库标识
      name: DRIVER_FACE_VIID_ID
      #数据集列表
      dependsOn:
        - DEVICE_ID
        - PASS_TIME
      preScript:
        content: "{ #dataset['DEVICE_ID'],#dataset['PASS_TIME'] }"
      postScript:
        content: "#faker.snowflake.viid(#dataset[0].SXJSBBM,'02',#dataset[1],'06')"
    - #字段名 主驾人脸INFO_ID
      name: DRIVER_FACE_INFO_ID
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: DRIVER_FACE_INFO_ID
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.snowflake.next"
    - #字段名 主驾驶员人像照片
      name: DRIVER_FACE_URL
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: DRIVER_FACE_URL
          type: CONSTANT
          #数据集
          dataSet:
            - "http://172.25.21.133:8088/simulation/pic/g1/M00/00011001/20200225/LDpT4l5U3CKIOctXAAAvpaTsytQAADzngPYf8wAAC-9855.jpg"
    - #字段名 副驾人脸视图库标识
      name: CO_DRIVER_FACE_VIID_ID
      #数据集列表
      dependsOn:
        - DEVICE_ID
        - PASS_TIME
      preScript:
        content: "{ #dataset['DEVICE_ID'],#dataset['PASS_TIME'] }"
      postScript:
        content: "#faker.snowflake.viid(#dataset[0].SXJSBBM,'02',#dataset[1],'06')"
    - #字段名 副驾人脸INFO_ID
      name: CO_DRIVER_FACE_INFO_ID
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: CO_DRIVER_FACE_INFO_ID
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.snowflake.next"
    - #字段名 副驾驶员人像照片
      name: CO_DRIVER_FACE_URL
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: CO_DRIVER_FACE_URL
          type: CONSTANT
          #数据集
          dataSet:
            - "http://172.25.21.133:8088/simulation/pic/g1/M00/00011001/20200225/LDpT4l5U3CKIOctXAAAvpaTsytQAADzngPYf8wAAC-9855.jpg"
    - #字段名 驾乘人脸截图的过车图
      name: STORAGE_URL
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: STORAGE_URL
          type: CONSTANT
          #数据集
          dataSet:
            - "http://172.25.21.133:8088/g1/M00/00031003/20210610/rBkVhWDB2GWIEZx-AAdwNGUSeOwAAAAWgAAAAAAB3BM397.jpg"
            - "http://172.25.21.133:8088/g1/M00/00031003/20210528/rBkVhWCwn7GIHz71AADogyvcEjMAAAADAA4xEEAAOib567.jpg"
            - "http://172.25.21.133:8088/simulation/pic/motorvehicle_20200225_16_44050100000034010001_cimya9.Jpeg"
            - "http://172.25.21.133:8088/g1/M00/00031003/20210528/rBkVhWCwn6WISyHPAAB_niC42DUAAAADAA4RIsAAH-2098.jpg"
            - "http://172.25.21.133:8088/simulation/pic/motorvehicle_20200225_16_44050100000031020002_5646rg.Jpeg"
    - #字段名 抓拍地点经度
      name: LONGITUDE
      converter: org.gensokyo.data.converter.FloatConverter
      #数据集列表
      dependsOn:
        - DEVICE_ID
      postScript:
        content: "#dataset.JD"
    - #字段名 抓拍地点纬度
      name: LATITUDE
      converter: org.gensokyo.data.converter.FloatConverter
      #数据集列表
      dependsOn:
        - DEVICE_ID
      postScript:
        content: "#dataset.WD"
    - #字段名 车辆抓拍视图库标识
      name: VIID_OBJECT_ID
      #数据集列表
      dependsOn:
        - DEVICE_ID
        - PASS_TIME
      preScript:
        content: "{ #dataset['DEVICE_ID'],#dataset['PASS_TIME'] }"
      postScript:
        content: "#faker.snowflake.viid(#dataset[0].SXJSBBM,'02',#dataset[1],'02')"
    - #字段名 行政区划代码
      name: ORG_CODE
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      dependsOn:
        - DEVICE_ID
      postScript:
        content: "#dataset.XZQH"
    - #字段名 入库时间
      name: INSERT_TIME
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      dependsOn:
        - PASS_TIME
      postScript:
        content: "#dataset"
    - #字段名 第三方数据标识
      name: THIRD_ID
      #数据集列表
      readers:
        - dataSetId: THIRD_ID
          type: CONSTANT
          dataSet: [ ]
    - #字段名 第三方来源系统
      name: THIRD_SRC
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        - dataSetId: THIRD_SRC
          type: CONSTANT
          dataSet: [ ]
    - #字段名 车辆类型（二次识别）
      name: CLLX
      #后置脚本处理
      postScript:
        content: "#dataset.CODE"
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: f_ds_1
          type: JDBC
          #数据源编号
          dataSourceId: 'pd_dicmanage'
          #数据集
          dataSet: 'SELECT CODE FROM SYS_DICT WHERE PARENT_ID = 40'
  writer:
    #目标数据集类型
    type: CLICKHOUSE
    #数据源编号
    dataSourceId: 'clickhouse'
    # 表名/索引名/主题名
    target: 'pd_dts_vehicle.VEHICLE_FRONT_FACE_INFO'
    #数据写入模板
    template: >-
      INFO_ID,DEVICE_ID,PASS_TIME,PLATE_NO,PLATE_COLOR,PLATE_CLASS,SPEED,ORIGINAL_DEVICE_ID,DEVICE_ADDR,TOLLGATE_ID,              
      ORIGINAL_TOLLGATE_ID,TOLLGATE_NAME,DRIVER_FACE_VIID_ID,DRIVER_FACE_INFO_ID,DRIVER_FACE_URL,CO_DRIVER_FACE_VIID_ID,
      CO_DRIVER_FACE_INFO_ID,CO_DRIVER_FACE_URL,STORAGE_URL,LONGITUDE,LATITUDE,VIID_OBJECT_ID,ORG_CODE,INSERT_TIME,
      THIRD_ID,THIRD_SRC,CLLX