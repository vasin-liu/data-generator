            - "http://172.25.21.133:8088/g1/M00/00031003/20210528/rBkVhWCwn6WISyHPAAB_niC42DUAAAADAA4RIsAAH-2098.jpg"
            - "http://172.25.21.133:8088/simulation/pic/motorvehicle_20200225_16_44050100000031020002_5646rg.Jpeg"
    - #字段名 车辆小图URL
      name: PIC_VEHICLE
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: PIC_VEHICLE
          type: CONSTANT
          #数据集
          dataSet:
            - "http://172.25.21.133:8088/g1/M00/00031003/20210528/rBkVhWCwn6WISyHPAAB_niC42DUAAAADAA4RIsAAH-2098.jpg"
            - "http://172.25.21.133:8088/simulation/pic/g1/M00/00011001/20200225/LDpT4l5U2z2IOAJ9AAcZxS4rRyYAADzmAP1wnQABxnd758.jpg"
            - "http://172.25.21.133:8088/simulation/pic/g2/M01/00011001/20200225/LDpT415U3CKID869AAhp-A8vTmkAAD1KwKY34AACGoQ573.jpg"
            - "http://172.25.21.133:8088/simulation/pic/g2/M01/00011001/20200225/LDpT415U2zmIXDlYAAP-Iid3racAAD1JQFY16sAA_46814.jpg"
            - "http://172.25.21.133:8088/g1/M00/00031003/20210528/rBkVhWCwn26IdFdgAABT00_opxEAAAADAAqrYQAAFPr743.jpg"
            - "http://172.25.21.133:8088/simulation/pic/g2/M00/00011001/20200225/LDpT415U2x6IMTvXAAbPnQjnTsoAAD1JgDx_sEABs-1838.jpg"
            - "http://172.25.21.133:8088/g1/M00/00031003/20210528/rBkVhWCwn7GIHz71AADogyvcEjMAAAADAA4xEEAAOib567.jpg"
            - "http://172.25.21.133:8088/g1/M00/00031003/20210528/rBkVhWCwn6WISyHPAAB_niC42DUAAAADAA4RIsAAH-2098.jpg"
            - "http://172.25.21.133:8088/g1/M00/00031003/20210528/rBkVhWCwn7GIHz71AADogyvcEjMAAAADAA4xEEAAOib567.jpg"
            - "http://172.25.21.133:8088/simulation/pic/g1/M01/00011001/20200225/LDpT4l5U2ziIM5KtAAWHoWDjiVwAADzmQKgxU8ABYe5966.jpg"
            - "http://172.25.21.133:8088/simulation/pic/g2/M01/00011001/20200225/LDpT415U2v2ILliCAATphe2VDy4AAD1IQP3V7MABOmd413.jpg"
            - "http://172.25.21.133:8088/simulation/pic/g2/M01/00011001/20200225/LDpT415U21aIPWTEAAb347UURtcAAD1JQMnDvUABvf7820.jpg"
            - "http://172.25.21.133:8088/simulation/pic/g1/M00/00011001/20200225/LDpT4l5U21aICtQlAAVEVr02mHMAADzmgFHfM8ABURu976.jpg"
            - "http://172.25.21.133:8088/simulation/pic/g2/M00/00011001/20200225/LDpT415U23GIM6RcAATc76ukOqsAAD1JgPm1TYABN0H656.jpg"
    - #字段名 是否有天窗
      name: WITH_SUNROOF
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: WITH_SUNROOF
          type: CONSTANT
          #数据集
          dataSet: [ 0,1,99 ]
    - #字段名 驾驶员打电话
      name: PILOT_CALL
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: PILOT_CALL
          type: CONSTANT
          #数据集
          dataSet: [ 0,1,99 ]
    - #字段名 车身长度，单位：厘米
      name: VEHICLE_LENGTH
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: VEHICLE_LENGTH
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.number.numberBetween(3900,5000)"
    - #字段名 是否有车身喷字
      name: GRAFFITI
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: GRAFFITI
          type: CONSTANT
          #数据集
          dataSet: [ 0,1,99 ]
    - #字段名 方向编号
      name: DIRECTION_ID
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      dependsOn:
        - DEVICE_ID
      postScript:
        content: "#dataset.FXMS"
    - #字段名 车道编号
      name: LANE_NO
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      dependsOn:
        - DEVICE_ID
      postScript:
        content: "#dataset.CDBH"
    - #字段名 过车车速
      name: SPEED
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: SPEED
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.number.numberBetween(60,120)"
    - #字段名 网关接收时间
      name: CJSJ
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: JGSK
          type: DIRECT_SPEL
          #数据集
          dataSet: >-
            #faker.expression("#{date.past '1','DAYS','yyMMddHHmmss'}")
    - #字段名 原始设备编号
      name: ORIGINAL_DEVICE_ID
      #数据集列表
      dependsOn:
        - DEVICE_ID
      postScript:
        content: "#dataset.SXJSBBM"
    - #字段名 抓拍地点
      name: DEVICE_ADDR
      #数据集列表
      dependsOn:
        - DEVICE_ID
      postScript:
        content: "#dataset.KKDZ"
    - #字段名 经过日期
      name: JGRQ
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: JGRQ
          type: DIRECT_SPEL
          #数据集
          dataSet: >-
            #faker.expression("#{date.past '1','DAYS','yyMMdd'}")
    - #字段名 经过时间
      name: JGSJ
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: JGSJ
          type: DIRECT_SPEL
          #数据集
          dataSet: >-
            #faker.expression("#{date.past '1','DAYS','HHmmss'}")
    - #字段名 号牌归属地（省市）
      name: HPGS
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      dependsOn:
        - HPHM
      postScript:
        content: "#faker.vehicleCN.plateProvince(#dataset)"
    - #字段名 车身区域
      name: CAR_RECT
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: CAR_RECT
          type: CONSTANT
          #数据集
          dataSet: [ "" ]
    - #字段名 车牌区域
      name: PLATE_RECT
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: PLATE_RECT
          type: CONSTANT
          #数据集
          dataSet: [ "" ]
    - #字段名 车辆品牌（二次识别）
      name: CAR_LOGO
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: CAR_LOGO
          type: CONSTANT
          #数据集
          dataSet: [ '红旗','宝马','奔驰' ]
    - #字段名 车辆子品牌（二次识别）
      name: CAR_SERIES
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: CAR_SERIES
          type: CONSTANT
          #数据集
          dataSet: [ 'X3','mini' ]
    - #字段名 进出信息
      name: IN_OUT_TYPE
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: IN_OUT_TYPE
          type: CONSTANT
          #数据集
          dataSet: [ 0,1,99 ]
    - #字段名 是否无牌车
      name: NO_PLATE_CAR
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: NO_PLATE_CAR
          type: CONSTANT
          #数据集
          dataSet: [ 0,1,99 ]
    - #字段名 数据来源
      name: DATA_SRC
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: DATA_SRC
          type: CONSTANT
          #数据集 1 抓拍卡口 2 微卡口 3 结构化 4 人脸门禁 5 离线结构化 6 停车场 7 驾驶人脸  8 旅业人脸  9 网吧人脸 10 娱乐场所
          dataSet: [ 1,2,3,4,5,6,7,9,10 ]
    - #字段名 入库时间
      name: INSERT_TIME
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      dependsOn:
        - CJSJ
      postScript:
        content: "#dataset"
    - #字段名 卡口编号
      name: TOLLGATE_ID
      #数据集列表
      dependsOn:
        - DEVICE_ID
      postScript:
        content: "#dataset.KKBH"
    - #字段名 原始卡口编号
      name: ORIGINAL_TOLLGATE_ID
      #数据集列表
      dependsOn:
        - DEVICE_ID
      postScript:
        content: "#dataset.KKBH"
    - #字段名 卡口名称
      name: TOLLGATE_NAME
      #数据集列表
      dependsOn:
        - DEVICE_ID
      postScript:
        content: "#dataset.KKMC"
    - #字段名 车道类型
      name: LANE_TYPE
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      dependsOn:
        - DEVICE_ID
      postScript:
        content: "#dataset.CDLX"
    - #字段名 前后车牌是否一致
      name: PLATE_UNIFORM
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        - dataSetId: PLATE_UNIFORM
          type: CONSTANT
          # 号牌是否一致，0—车头和车尾号牌号码不一致 1—车头和车尾号牌号码完全一致 2—车头号牌号码无法自动识别 3—车尾号牌号码无法自动识别 4—车头和车尾号牌号码均无法自动识别 99-未知
          dataSet: [ 99 ]
    - #字段名 车辆限速（车道限速速度）
      name: VECHILE_LIMIT_SPEED
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        - dataSetId: VECHILE_LIMIT_SPEED
          type: CONSTANT
          dataSet: [ 60,70,80 ]
    - #字段名 车辆外型（预留）
      name: VEHICLE_APPEARANCE
      #数据集列表
      readers:
        - dataSetId: VEHICLE_APPEARANCE
          type: CONSTANT
          dataSet: [ '' ]
    - #字段名 放下遮阳板
      name: VEHICLE_SUNVISOR
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        - dataSetId: VEHICLE_SUNVISOR
          type: CONSTANT
          dataSet: [ 0,1,99 ]
    - #字段名 建设部门名称
      name: ORGAN_NAME
      #数据集列表
      dependsOn:
        - DEVICE_ID
      postScript:
        content: "#dataset.JSDW"
    - #字段名 过车数据质量检测结果
      name: VEHICLE_QUALITY
      #数据集列表
