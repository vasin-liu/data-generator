# 数据集名称，各个文件中唯一
name: car_detect_info_yisa_clickhouse
#生成数量
amount: 100000
#批次数量
batchSize: 10000
#全局配置
global:
  #线程池配置
  executor:
    #核心线程数
    coreSize: 8
    #最大线程数
    maxSize: 16
    #队列大小
    queueCapacity: 16

# 数据集元数据配置
table:
  # 字段配置列表
  fields:
    #字段配置
    - #虚拟字段用来处理依赖关系字段的数据集选择
      name: virtual_filed
      readers:
        - dataSetId: virtual_filed_ds
          type: CONSTANT
          # 1 普通小车；2 普通大车；3 香港车；4 澳门车；5 教练车；6 警车；7 挂车；
          dataSet: [ 1,2,3,4,5,6,7 ]
    - #字段名 信息主键编号
      name: INFO_ID
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: INFO_ID
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.snowflake.next"
    - #字段名 号牌种类（二次识别）
      name: HPZL
      dependsOn:
        - virtual_filed
      resultMapper:
        defaultDataset: [ 0 ]
        mappers:
          - key: "1"
            dataset: [ 2 ]
          - key: "2"
            dataset: [ 1 ]
          - key: "3"
            dataset: [ 26 ]
          - key: "4"
            dataset: [ 27 ]
          - key: "5"
            dataset: [ 2 ]
          - key: "6"
            dataset: [ 23 ]
          - key: "7"
            dataset: [ 1 ]
    - #字段名 车辆类型（二次识别）
      name: CLLX
      #后置脚本处理
      postScript:
        content: "#dataset.CODE"
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: f_ds_1
          type: JDBC
          #数据源编号
          dataSourceId: 'pd_dicmanage'
          #数据集
          dataSet: 'SELECT CODE FROM SYS_DICT WHERE PARENT_ID = 40'
    - #字段名 车身颜色（二次识别）
      name: CSYS
      converter: org.gensokyo.data.converter.LongConverter
      #后置脚本处理
      postScript:
        content: "#dataset.CODE"
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: CSYS
          type: JDBC
          #数据源编号
          dataSourceId: 'pd_dicmanage'
          #数据集
          dataSet: 'SELECT CODE FROM SYS_DICT WHERE PARENT_ID = 95'
    - #字段名 是否违章
      name: ILLEGAL
      #字段值转换器
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: ILLEGAL
          type: CONSTANT
          #数据集
          dataSet: [ 0,1,99 ]
    - #字段名 设备编号
      name: DEVICE_ID
      postScript:
        content: "#dataset.SXJSBBM"
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: DEVICE_ID
          type: JDBC
          #数据源编号
          dataSourceId: 'omof'
          #数据集
          dataSet: >-
            SELECT OVBI.KKBH,OVBI.KKMC,OVBI.KKDZ,OVBI.KKMC,OVBI.XZQH,OVBI.JSDW,OVBI.FXMS,OVBI.ZPFXLX,
            OVBI.DLMC,OVBI.JD,OVBI.WD,OLI.SXJSBBM,OLI.CDBH,OLI.CDLX 
            FROM OMOF_VEHICLE_BARRIER_INFO OVBI INNER JOIN OMOF_LANE_INFO OLI ON OVBI.KKBH = OLI.KKBH
    - #字段名 抓拍时间
      name: JGSK
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: JGSK
          type: DIRECT_SPEL
          #数据集
          dataSet: >-
            #faker.expression("#{date.past '1','DAYS','yyMMddHHmmss'}")
    - #字段名 号牌号码（二次识别）
      name: HPHM
      dependsOn:
        - virtual_filed
      preScript:
        content: "#faker.vehicleCN.plate(#dataset['virtual_filed'])"
    - #字段名 号牌颜色（二次识别）
      name: HPYS
      converter: org.gensokyo.data.converter.LongConverter
      dependsOn:
        - virtual_filed
      resultMapper:
        defaultDataset: [ 0 ]
        mappers:
          - key: "1"
            dataset: [ 0 ] #蓝色
          - key: "2"
            dataset: [ 2 ] #黄色
          - key: "3"
            dataset: [ 1 ] #黑色
          - key: "4"
            dataset: [ 1 ] #黑色
          - key: "5"
            dataset: [ 2 ] #黄色
          - key: "6"
            dataset: [ 3 ] #白色
          - key: "7"
            dataset: [ 2 ] #黄色
    - #字段名 车辆年代款（二次识别）
      name: CAR_YEAR
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: CAR_YEAR
          type: CONSTANT
          #数据集
          dataSet: [ '2019','2020','2021','2022','2023' ]
    - #字段名 驾驶员遮阳板情况
      name: PILOT_SUNVISOR
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: PILOT_SUNVISOR
          type: CONSTANT
          #数据集
          dataSet: [ 0,1,99 ]
    - #字段名 副驾驶遮阳板情况
      name: COPILOT_SUNVISOR
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: COPILOT_SUNVISOR
          type: CONSTANT
          #数据集
          dataSet: [ 0,1,99 ]
    - #字段名 是否有挂坠
      name: PENDANTS
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: PENDANTS
          type: CONSTANT
          #数据集
          dataSet: [ 0,1,99 ]
    - #字段名 是否有摆件
      name: ACCESSORY
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: ACCESSORY
          type: CONSTANT
          #数据集
          dataSet: [ 0,1,99 ]
    - #字段名 是否有纸巾盒
      name: TISSUE
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: TISSUE
          type: CONSTANT
          #数据集
          dataSet: [ 0,1,99 ]
    - #字段名 驾驶员安全带情况
      name: PILOT_SEATBELT
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: PILOT_SEATBELT
          type: CONSTANT
          #数据集
          dataSet: [ 0,1,99 ]
    - #字段名 副驾驶安全带情况
      name: COPILOT_SEATBELT
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: COPILOT_SEATBELT
          type: CONSTANT
          #数据集
          dataSet: [ 0,1,99 ]
    - #字段名 车牌小图URL
      name: PIC_PLATE
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: PIC_PLATE
          type: CONSTANT
          #数据集
          dataSet:
            - "http://172.25.21.133:8088/simulation/pic/g1/M01/00011001/20200225/LDpT4l5U2xqIerXBAAAZOo6T43EAADzmQIba1IAABlS467.jpg"
            - "http://172.25.21.133:8088/simulation/pic/g2/M01/00011001/20200225/LDpT415U3HeIG0A0AAAXhp_0kZMAAD1KgKdSXcAABee516.jpg"
            - "http://172.25.21.133:8088/simulation/pic/g2/M00/00011001/20200225/LDpT415U2zmIEUEIAAAmYpqcYCkAAD1JgFY-cMAACZ6559.jpg"
            - "http://172.25.21.133:8088/simulation/pic/g2/M00/00011001/20200225/LDpT415U2x2IcE6CAAAm6rbQPtAAAD1JgDn9TIAACcC957.jpg"
            - "http://172.25.21.133:8088/simulation/pic/g1/M00/00011001/20200225/LDpT4l5U26SIIKE5AAAww51_jvQAADzngCeJu8AADDb256.jpg"
            - "http://172.25.21.133:8088/simulation/pic/g1/M00/00011001/20200225/LDpT4l5U2uKINBpAAAAXzxQFQ-kAADzlwECudYAABfn848.jpg"
    - #字段名 全景图URL
      name: PIC_ABBREVIATE
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          dataSetId: PIC_ABBREVIATE
          type: CONSTANT
          #数据集
          dataSet:
            - "http://172.25.21.133:8088/g1/M00/00031003/20210610/rBkVhWDB2GWIEZx-AAdwNGUSeOwAAAAWgAAAAAAB3BM397.jpg"
            - "http://172.25.21.133:8088/g1/M00/00031003/20210528/rBkVhWCwn7GIHz71AADogyvcEjMAAAADAA4xEEAAOib567.jpg"
