# 数据集名称，各个文件中唯一
name: dtem_coach_teaching
#生成数量
amount: 1000
#批次数量
batchSize: 100
#全局配置
global:
  #线程池配置
  executor:
    #核心线程数
    coreSize: 8
    #最大线程数
    maxSize: 16
    #队列大小
    queueCapacity: 16

# 数据集元数据配置
table:
  # 字段配置列表
  fields:
    #字段配置
    - #字段名
      name: ID
      converter: org.gensokyo.data.converter.LongConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.snowflake.next"
    - #字段名
      name: COACH_ID
      converter: org.gensokyo.data.converter.LongConverter
      #后置脚本处理
      postScript:
        content: "#dataset.ID"
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: JDBC
          #数据源编号
          dataSourceId: 'tocc_driving_school'
          #数据集
          dataSet: "SELECT ID FROM DTEM_COACH WHERE STATUS = 'S0A'"
    - #字段名
      name: STUDENT_ID
      converter: org.gensokyo.data.converter.LongConverter
      #后置脚本处理
      postScript:
        content: "#dataset.ID"
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: JDBC
          #数据源编号
          dataSourceId: 'tocc_driving_school'
          #数据集
          dataSet: "SELECT ID FROM DTEM_STUDENT WHERE STATUS = 'S0A'"
    - #字段名
      name: COURSE_TYPE
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: CONSTANT
          #数据集
          dataSet: [1,2,3,4]
    - #字段名
      name: TEACHING_DATE
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: >-
            #faker.expression("#{date.past '5','DAYS','yyyy-MM-dd HH:mm:ss'}")
    - #字段名
      name: TEACHING_DURATION
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.number.numberBetween(1,8)"
    - #字段名
      name: CREATE_BY
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: CONSTANT
          #数据集
          dataSet: [ "admin" ]
    - #字段名
      name: UPDATE_BY
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: CONSTANT
          #数据集
          dataSet: [ "admin" ]
  writer:
    #目标数据集类型
    type: JDBC
    #数据源编号
    dataSourceId: 'tocc_driving_school'
    # 表名/索引名/主题名
    target: 'dtem_coach_teaching'
    #数据写入模板
    template: "ID,COACH_ID,STUDENT_ID,COURSE_TYPE,TEACHING_DATE,TEACHING_DURATION,CREATE_BY,UPDATE_BY"