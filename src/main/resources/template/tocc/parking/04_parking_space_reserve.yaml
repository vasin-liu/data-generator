# 数据集名称，各个文件中唯一
name: parking_space_reserve
#生成数量
amount: 20
#批次数量
batchSize: 20
#全局配置
global:
  #线程池配置
  executor:
    #核心线程数
    coreSize: 8
    #最大线程数
    maxSize: 16
    #队列大小
    queueCapacity: 16

# 数据集元数据配置
table:
  fields:
    - name: ID
      stages:
        - type: READ
          readers:
            - type: SPEL
              content: "#faker.snowflake.next"
        - type: SELECT
    - name: PARKING_LOT_ID
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: JDBC
              dataSourceId: 'tocc_parking'
              content: "SELECT ID,PARKING_LOT_NAME FROM TOCC_PARKING_LOT.PARKING_LOT_BASE WHERE STATUS = 'S0A' LIMIT 20"
        - type: SELECT
        - type: SCRIPT
          scriptType: SPEL
          content: "#dataset.ID"
    - name: PARKING_LOT_NAME
      dependsOn:
        - PARKING_LOT_ID
      stages:
        - type: SCRIPT
          scriptType: SPEL
          content: "#dataset.PARKING_LOT_NAME"
    - name: PLATE_NUMBER
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: JDBC
              dataSourceId: 'tocc_parking'
              content: "SELECT * FROM TOCC_PARKING_LOT.PARKING_USER_VEHICLE WHERE STATUS = 'S0A' LIMIT 20"
        - type: SELECT
        - type: SCRIPT
          scriptType: SPEL
          content: "#dataset.PLATE_NUMBER"
    - name: PLATE_COLOR
      dependsOn:
        - PLATE_NUMBER
      stages:
        - type: SCRIPT
          scriptType: SPEL
          content: "#dataset.PLATE_COLOR"
    - name: PLATE_TYPE
      dependsOn:
        - PLATE_NUMBER
      stages:
        - type: SCRIPT
          scriptType: SPEL
          content: "#dataset.PLATE_TYPE"
    - name: PHONE
      dependsOn:
        - PLATE_NUMBER
      stages:
        - type: SCRIPT
          scriptType: SPEL
          content: "#dataset.PHONE"
    - name: RECEIVE_PHONE
      dependsOn:
        - PLATE_NUMBER
      stages:
        - type: SCRIPT
          scriptType: SPEL
          content: "#dataset.PHONE"
    - name: RESERVE_DATE
      stages:
        - type: READ
          readers:
            - type: SPEL
              content: >-
                #faker.expression("#{date.past '1','DAYS','yyyy-MM-dd'}")
    - name: START_TIME
      stages:
        - type: READ
          readers:
            - type: SPEL
              content: >-
                #faker.expression("#{date.past '1','DAYS','yyyy-MM-dd HH:mm:ss'}")
    - name: END_TIME
      dependsOn:
        - START_TIME
      stages:
        - type: SCRIPT
          scriptType: SPEL
          content: >-
            #faker.datetime.afterMinutes(#dataset,30,120)
    - name: EXTENSION_TIMES
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: CONSTANT
              content: [ 0,1 ]
#    - name: EXTENSION_END_TIME
#      stages:
#        - type: READ
#          inMemory: true
#          readers:
#            - type: CONSTANT
#              content: [ ]
#    - name: CANCEL_TIME
#      stages:
#        - type: READ
#          inMemory: true
#          readers:
#            - type: CONSTANT
#              content: [ ]
    - name: RESERVE_STATUS
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: CONSTANT
              content: [ 0,1,2 ]
#    - name: ACT_PARKING_LOT_ID
#      stages:
#        - type: READ
#          inMemory: true
#          readers:
#            - type: CONSTANT
#              content: [ ]
    - name: ACT_PARKING_LOT_NAME
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: CONSTANT
              content: [ 0,1,2 ]
    - name: ACT_IN_TIME
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: CONSTANT
              content: [ 0,1,2 ]
    - name: ACT_OUT_TIME
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: CONSTANT
              content: [ 0,1,2 ]
    - name: STATUS
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: CONSTANT
              content: [ 'S0A' ]
    - name: CREATE_TIME
      stages:
        - type: READ
          readers:
            - type: SPEL
              content: >-
                #faker.expression("#{date.past '1','DAYS','yyyy-MM-dd HH:mm:ss'}")
    - name: UPDATE_TIME
      dependsOn:
        - CREATE_TIME
      stages:
        - type: SCRIPT
          scriptType: SPEL
          content: "#dataset"


# 数据输出配置
output:
  writers:
    #    - type: CONSOLE
    - type: JDBC
      dataSourceId: 'tocc_parking'
      target: 'PARKING_SPACE_RESERVE'
      template: >-
        ID,PARKING_LOT_ID,PARKING_LOT_NAME,PLATE_NUMBER,PLATE_COLOR,PLATE_TYPE,RESERVE_DATE,START_TIME,END_TIME,PHONE,
        RECEIVE_PHONE,RESERVE_STATUS,STATUS,CREATE_TIME,UPDATE_TIME