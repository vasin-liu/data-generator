# 数据集名称，各个文件中唯一
name: car_detect_info
#生成数量
amount: 10000000
#批次数量
batchSize: 10000
#全局配置
global:
  #线程池配置
  executor:
    #核心线程数
    coreSize: 8
    #最大线程数
    maxSize: 16
    #队列大小
    queueCapacity: 16

# 数据集元数据配置
table:
  fields:
    - name: virtual_filed
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: CONSTANT
              # 1 普通小车；2 普通大车；3 香港车；4 澳门车；5 教练车；6 警车；7 挂车；
              content: [ 1,2,3,4,5,6,7 ]
    - name: INFO_ID
      stages:
        - type: READ
          readers:
            - type: SPEL
              content: "#faker.snowflake.next"
        - type: SELECT
    - name: HPZL
      dependsOn:
        - virtual_filed
      stages:
        - type: MAPPING
          defaultValue: 0
          mapping:
            1: 2
            2: 1
            3: 26
            4: 27
            5: 2
            6: 23
            7: 1
    - name: CLLX
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: JDBC
              dataSourceId: 'pd_dicmanage'
              content: 'SELECT CODE FROM SYS_DICT WHERE PARENT_ID = 40'
        - type: SELECT
        - type: SCRIPT
          scriptType: SPEL
          content: "#dataset.CODE"
    - name: CSYS
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: JDBC
              dataSourceId: 'pd_dicmanage'
              content: 'SELECT CODE FROM SYS_DICT WHERE PARENT_ID = 95'
        - type: SELECT
        - type: SCRIPT
          scriptType: SPEL
          content: "#dataset.CODE"
    - name: ILLEGAL
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: CONSTANT
              content: [ 0,1,99 ]
        - type: SELECT
    - name: DEVICE_ID
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: JDBC
              dataSourceId: 'omof'
              content: >-
                SELECT OVBI.KKBH,OVBI.KKMC,OVBI.KKDZ,OVBI.KKMC,OVBI.XZQH,OVBI.JSDW,OVBI.FXMS,OVBI.ZPFXLX,
                OVBI.DLMC,OVBI.JD,OVBI.WD,OLI.SXJSBBM,OLI.CDBH,OLI.CDLX
                FROM OMOF_VEHICLE_BARRIER_INFO OVBI INNER JOIN OMOF_LANE_INFO OLI ON OVBI.KKBH = OLI.KKBH
        - type: SELECT
        - type: SCRIPT
          scriptType: SPEL
          content: "#dataset.SXJSBBM"
    - name: JGSK
      stages:
        - type: READ
          readers:
            - type: SPEL
              content: >-
                #faker.expression("#{date.past '1','DAYS','yyMMddHHmmss'}")
    - name: HPHM
      dependsOn:
        - virtual_filed
      stages:
        - type: SCRIPT
          scriptType: SPEL
          content: "#faker.vehicleCN.plate(#dataset)"
    - name: HPYS
      dependsOn:
        - virtual_filed
      stages:
        - type: MAPPING
          defaultValue: 0
          mapping:
            1: 0
            2: 2
            3: 1
            4: 1
            5: 2
            6: 3
            7: 2
    - name: CAR_YEAR
      stages:
        - type: READ
          inMemory: true
