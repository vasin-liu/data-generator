# 数据集名称，各个文件中唯一
name: vehicle_gps_record
#生成数量
amount: 100
#批次数量
batchSize: 100
#全局配置
global:
  #线程池配置
  executor:
    #核心线程数
    coreSize: 8
    #最大线程数
    maxSize: 16
    #队列大小
    queueCapacity: 16

# 数据集元数据配置
table:
  fields:
    - name: ID
      stages:
        - type: READ
          readers:
            - type: SPEL
              content: "#faker.snowflake.next"
        - type: SELECT
    - name: PLATE_NUMBER
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: JDBC
              dataSourceId: 'tocc_parking'
              content: "SELECT PLATE_NUMBER FROM TOCC_PARKING_LOT.BASEDATA_VEHICLE_INFO LIMIT 10"
        - type: SELECT
        - type: SCRIPT
          scriptType: SPEL
          content: "#dataset.PLATE_NUMBER"
    - name: LONGTITUDE
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: CONSTANT
              content: [ [113.41000783360504,23.07519846531121],[113.41138399965796,23.074413660231517],[113.41283732525187,23.073714959789275],[113.41000783360504,23.07519846531121],[113.41138399965796,23.074413660231517],[113.41283732525187,23.073714959789275],[113.41000783360504,23.07519846531121],[113.41138399965796,23.074413660231517],[113.41283732525187,23.073714959789275],[113.40990371336989,23.07521170236646],[113.41024011292654,23.07500537913056],[113.41064058859126,23.07475484334654],[113.41151763029552,23.074275876579946],[113.41290327609437,23.07360900462477] ]
        - type: SELECT
        - type: SCRIPT
          scriptType: SPEL
          content: "#dataset[0]"
    - name: LATITUDE
      dependsOn:
        - LONGTITUDE
      stages:
        - type: SCRIPT
          scriptType: SPEL
          content: "#dataset[1]"
    - name: UPLOAD_TIME
      stages:
        - type: READ
          readers:
            - type: SPEL
              content: >-
                #faker.expression("#{date.past '1','DAYS','yyMMddHHmmss'}")
    - name: SPEED
      stages:
        - type: READ
          readers:
            - type: SPEL
              content: "#faker.number.numberBetween(60,120)"
    - name: ANGLE
      stages:
        - type: READ
          readers:
            - type: SPEL
              content: "#faker.number.numberBetween(1,360)"
    - name: STATUS
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: CONSTANT
              content: [ 'S0A' ]
    - name: CREATE_TIME
      stages:
        - type: READ
          readers:
            - type: SPEL
              content: >-
                #faker.expression("#{date.past '1','DAYS','yyyy-MM-dd HH:mm:ss'}")
    - name: UPDATE_TIME
      dependsOn:
        - CREATE_TIME
      stages:
        - type: SCRIPT
          scriptType: SPEL
          content: "#dataset"


# 数据输出配置
output:
  writers:
    - type: CONSOLE
#    - type: JDBC
#      dataSourceId: 'tocc_parking'
#      target: 'VEHICLE_GPS_RECORD'
#      template: >-
#        ID,PLATE_NUMBER,LONGTITUDE,LATITUDE,UPLOAD_TIME,SPEED,ANGLE,STATUS,CREATE_TIME,UPDATE_TIME