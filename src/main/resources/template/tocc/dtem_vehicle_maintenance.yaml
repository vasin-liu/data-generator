# 数据集名称，各个文件中唯一
name: dtem_vehicle_maintenance
#生成数量
amount: 1000
#批次数量
batchSize: 100
#全局配置
global:
  #线程池配置
  executor:
    #核心线程数
    coreSize: 8
    #最大线程数
    maxSize: 16
    #队列大小
    queueCapacity: 16

# 数据集元数据配置
table:
  # 字段配置列表
  fields:
    #字段配置
    - #字段名
      name: ID
      converter: org.gensokyo.data.generator.converter.LongConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.snowflake.next"
    - #字段名
      name: VEHICLE_ID
      converter: org.gensokyo.data.generator.converter.LongConverter
      #后置脚本处理
      postScript:
        content: "#dataset.ID"
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: JDBC
          #数据源编号
          dataSourceId: 'tocc_driving_school'
          #数据集
          dataSet: "SELECT ID FROM DTEM_VEHICLE WHERE STATUS = 'S0A'"
    - #字段名
      name: MAINTENANCE_TYPE
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: CONSTANT
          #数据集
          dataSet: [ 1,2,3 ]
    - #字段名
      name: MAINTENANCE_TIME
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: >-
            #faker.expression("#{date.past '2','DAYS','yyyy-MM-dd HH:mm:ss'}")
    - #字段名
      name: MAINTENANCE_CONTENT
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: >-
            #faker.expression("#{text.text '500'}")
    - #字段名
      name: MAINTENANCE_PLACE
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.address.streetAddress"
    - #字段名
      name: MAINTENANCE_PERSON
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.name.fullName"
    - #字段名
      name: CREATE_BY
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: CONSTANT
          #数据集
          dataSet: [ "admin" ]
    - #字段名
      name: UPDATE_BY
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: CONSTANT
          #数据集
          dataSet: [ "admin" ]
  writer:
    #目标数据集类型
    type: JDBC
    #数据源编号
    dataSourceId: 'tocc_driving_school'
    # 表名/索引名/主题名
    target: 'dtem_vehicle_maintenance'
    #数据写入模板
    template: "ID,VEHICLE_ID,MAINTENANCE_TYPE,MAINTENANCE_TIME,MAINTENANCE_CONTENT,MAINTENANCE_PLACE,MAINTENANCE_PERSON,CREATE_BY,UPDATE_BY"