# 数据集名称，各个文件中唯一
name: dtem_driving_school
#生成数量
amount: 100
#批次数量
batchSize: 10
#全局配置
global:
  #线程池配置
  executor:
    #核心线程数
    coreSize: 8
    #最大线程数
    maxSize: 16
    #队列大小
    queueCapacity: 16

# 数据集元数据配置
table:
  # 字段配置列表
  fields:
    #字段配置
    - #字段名
      name: ID
      converter: org.gensokyo.data.generator.converter.LongConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.snowflake.next"
    - #字段名
      name: SCHOOL_CODE
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.snowflake.next"
    - #字段名
      name: NAME
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.company.name"
    - #字段名
      name: BUSINESS_ADDRESS
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.address.streetAddress"
    - #字段名
      name: LEGAL_ADDRESS
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.address.streetAddress"
    - #字段名
      name: REGION_CODE
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: CONSTANT
          #数据集
          dataSet: [ "440103","440104","440105","440106","440111","440112","440113","440114","440115","440117","440118" ]
    - #字段名
      name: SCHOOL_TYPE
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: CONSTANT
          #数据集
          dataSet: [ 1,2,3 ]
    - #字段名
      name: SCHOOL_LEVEL
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: CONSTANT
          #数据集
          dataSet: [ 1,2,3 ]
    - #字段名
      name: SOCIAL_CREDIT_CODE
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.snowflake.next"
    - #字段名
      name: ECONOMIC_TYPE
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: CONSTANT
          #数据集
          dataSet: [ 1,2 ]
    - #字段名
      name: BUSINESS_TYPE
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: CONSTANT
          #数据集
          dataSet: [ 1,2,3 ]
    - #字段名
      name: BUSINESS_SCOPE
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: CONSTANT
          #数据集
          dataSet: [ "A1","A2","A3","B1","B2","C1","C2","C3","C4","D","E","F","M","N","P","C5" ]
    - #字段名
      name: LONGITUDE
      converter: org.gensokyo.data.generator.converter.FloatConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.address.longitude"
    - #字段名
      name: LATITUDE
      converter: org.gensokyo.data.generator.converter.FloatConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.address.latitude"
    - #字段名
      name: TELEPHONE
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.phoneNumber.cellPhone"
    - #字段名
      name: CONTACTS
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.name.fullName"
    - #字段名
      name: LEGAL_PERSON
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.name.fullName"
    - #字段名
      name: DIRECTOR
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.name.fullName"
    - #字段名
      name: DIRECTOR_TELEPHONE
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.phoneNumber.cellPhone"
    - #字段名
      name: REGISTRATION_DATE
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: >-
            #faker.expression("#{date.past '1','DAYS','yyyy-MM-dd HH:mm:ss'}")
    - #字段名
      name: BUSINESS_STATUS
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: CONSTANT
          #数据集
          dataSet: [ 1,2 ]
    - #字段名
      name: STATUS
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: CONSTANT
          #数据集
          dataSet: [ "S0A" ]
    - #字段名
      name: CREATE_BY
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: CONSTANT
          #数据集
          dataSet: [ "admin" ]
    - #字段名
      name: UPDATE_BY
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: CONSTANT
          #数据集
          dataSet: [ "admin" ]
  writer:
    #目标数据集类型
    type: JDBC
    #数据源编号
    dataSourceId: 'tocc_driving_school'
    # 表名/索引名/主题名
    target: 'dtem_driving_school'
    #数据写入模板
    template: "ID,SCHOOL_CODE,NAME,BUSINESS_ADDRESS,LEGAL_ADDRESS,REGION_CODE,SCHOOL_TYPE,SCHOOL_LEVEL,SOCIAL_CREDIT_CODE,ECONOMIC_TYPE,BUSINESS_TYPE,BUSINESS_SCOPE,LONGITUDE,LATITUDE,TELEPHONE,CONTACTS,LEGAL_PERSON,DIRECTOR,DIRECTOR_TELEPHONE,REGISTRATION_DATE,BUSINESS_STATUS,STATUS"