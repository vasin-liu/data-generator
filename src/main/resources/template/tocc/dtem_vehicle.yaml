# 数据集名称，各个文件中唯一
name: dtem_vehicle
#生成数量
amount: 1000
#批次数量
batchSize: 100
#全局配置
global:
  #线程池配置
  executor:
    #核心线程数
    coreSize: 8
    #最大线程数
    maxSize: 16
    #队列大小
    queueCapacity: 16

# 数据集元数据配置
table:
  # 字段配置列表
  fields:
    #字段配置
    - #虚拟字段用来处理依赖关系字段的数据集选择
      name: virtual_filed
      readers:
        - type: CONSTANT
          # 1 普通小车；2 普通大车；3 香港车；4 澳门车；5 教练车；6 警车；7 挂车；
          dataSet: [ 5 ]
    - #字段名
      name: ID
      converter: org.gensokyo.data.generator.converter.LongConverter
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.snowflake.next"
    - #字段名
      name: SCHOOL_ID
      converter: org.gensokyo.data.generator.converter.LongConverter
      #后置脚本处理
      postScript:
        content: "#dataset.ID"
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: JDBC
          #数据源编号
          dataSourceId: 'tocc_driving_school'
          #数据集
          dataSet: "SELECT ID FROM DTEM_DRIVING_SCHOOL WHERE STATUS = 'S0A'"
    - #字段名
      name: PLATE_NUMBER
      dependsOn:
        - virtual_filed
      preScript:
        content: "#faker.vehicleCN.plate(#dataset['virtual_filed'])"
    - #字段名
      name: PLATE_COLOR
      converter: org.gensokyo.data.generator.converter.LongConverter
      dependsOn:
        - virtual_filed
      resultMapper:
        defaultDataset: [ 0 ]
        mappers:
          - key: "1"
            dataset: [ 0 ] #蓝色
          - key: "2"
            dataset: [ 2 ] #黄色
          - key: "3"
            dataset: [ 1 ] #黑色
          - key: "4"
            dataset: [ 1 ] #黑色
          - key: "5"
            dataset: [ 2 ] #黄色
          - key: "6"
            dataset: [ 3 ] #白色
          - key: "7"
            dataset: [ 2 ] #黄色
    - #字段名
      name: VIN
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.vehicle.vin"
    - #字段名
      name: ENGINE_NUMBER
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.snowflake.next"
    - #字段名
      name: REGION_CODE
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: CONSTANT
          #数据集
          dataSet: [ "440103","440104","440105","440106","440111","440112","440113","440114","440115","440117","440118" ]
    - #字段名
      name: MANUFACTURER
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.vehicle.manufacturer"
    - #字段名
      name: VEHICLE_BRAND
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.vehicle.style"
    - #字段名
      name: VEHICLE_MODEL
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.vehicle.model"
    - #字段名
      name: DRIVING_TYPE
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: CONSTANT
          #数据集
          dataSet: [ "A1","A2","A3","B1","B2","C1","C2","C3","C4","D","E","F","M","N","P","C5" ]
    - #字段名
      name: PURCHASING_DATE
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: >-
            #faker.expression("#{date.past '1','DAYS','yyyy-MM-dd HH:mm:ss'}")
    - #字段名
      name: FUEL_TYPE
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: CONSTANT
          #数据集
          dataSet: [ 1,2,3,4,5,6 ]
    - #字段名
      name: REGISTRATION_DATE
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: >-
            #faker.expression("#{date.past '1','DAYS','yyyy-MM-dd HH:mm:ss'}")
    - #字段名
      name: IS_BINDING
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: CONSTANT
          #数据集
          dataSet: [ 0,1 ]
    - #字段名
      name: TERMINAL_NO
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.snowflake.next"
    - #字段名
      name: RECORD_DATE
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: >-
            #faker.expression("#{date.past '1','DAYS','yyyy-MM-dd HH:mm:ss'}")
    - #字段名
      name: SIM_NO
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: DIRECT_SPEL
          #数据集
          dataSet: "#faker.snowflake.next"
    - #字段名
      name: IS_RECORD
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: CONSTANT
          #数据集
          dataSet: [ 0,1 ]
    - #字段名
      name: STATUS
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: CONSTANT
          #数据集
          dataSet: [ "S0A" ]
    - #字段名
      name: CREATE_BY
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: CONSTANT
          #数据集
          dataSet: [ "admin" ]
    - #字段名
      name: UPDATE_BY
      #数据集列表
      readers:
        #单个数据集读取配置
        - #数据集类型
          type: CONSTANT
          #数据集
          dataSet: [ "admin" ]
  writer:
    #目标数据集类型
    type: JDBC
    #数据源编号
    dataSourceId: 'tocc_driving_school'
    # 表名/索引名/主题名
    target: 'dtem_vehicle'
    #数据写入模板
    template: "ID,SCHOOL_ID,PLATE_NUMBER,PLATE_COLOR,VIN,ENGINE_NUMBER,REGION_CODE,MANUFACTURER,VEHICLE_BRAND,VEHICLE_MODEL,DRIVING_TYPE,PURCHASING_DATE,FUEL_TYPE,REGISTRATION_DATE,IS_BINDING,TERMINAL_NO,RECORD_DATE,SIM_NO,IS_RECORD,STATUS,CREATE_BY,UPDATE_BY"