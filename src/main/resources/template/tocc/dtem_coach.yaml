# 数据集名称，各个文件中唯一
name: dtem_coach
#生成数量
amount: 10
#批次数量
batchSize: 5
#全局配置
global:
  #线程池配置
  executor:
    #核心线程数
    coreSize: 8
    #最大线程数
    maxSize: 16
    #队列大小
    queueCapacity: 16

# 数据集元数据配置
table:
  # 字段配置列表
  fields:
    #字段配置
    - #字段名
      name: ID
      stages:
        - type: read
          readers:
            #单个数据集读取配置
            - #数据集类型
              type: DIRECT_SPEL
              #数据集
              dataSet: "#faker.snowflake.next"
#        - type: select
    - #字段名
      name: SCHOOL_ID
      stages:
        - #
          type: read
          readers:
            #单个数据集读取配置
            - #数据集类型
              type: JDBC
              #数据源编号
              dataSourceId: 'tocc_driving_school'
              #数据集
              dataSet: "SELECT ID FROM DTEM_DRIVING_SCHOOL WHERE STATUS = 'S0A'"
        - type: select
        - type: script
          scriptType: SPEL
          content: "#dataset.ID"
  writers:
    - #目标数据集类型
      writerType: CONSOLE
      #数据源编号
      dataSourceId: 'tocc_driving_school'
      # 表名/索引名/主题名
      target: 'dtem_coach'
      #数据写入模板
      template: "ID,SCHOOL_ID"