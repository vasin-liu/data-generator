# 数据集名称，各个文件中唯一
name: demo_01
#生成数量
amount: 10
#批次数量
batchSize: 5
#全局配置
global:
  #线程池配置
  executor:
    #核心线程数
    coreSize: 8
    #最大线程数
    maxSize: 16
    #队列大小
    queueCapacity: 16

# 数据集元数据配置
table:
  fields:
    - name: ID
      stages:
        - type: READ
          # 读取器选择类型，可选值：EQUAL,WEIGHT
          strategyType: WEIGHT
          # 内存驻留需设置为 false，默认为 false
          # inMemory: false
          readers:
            - type: SPEL
              weight: 100
              content: "#faker.snowflake.next"
            - type: SPEL
              weight: 100
              content: "#faker.common.text(9,10)"
    - name: STATUS
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: CONSTANT
              content: [ 'S0A', 'S0X' ,'S0D', 'S0H' ]
        - type: SELECT
    - name: CREATE_TIME
      stages:
        - type: READ
          readers:
            - type: SPEL
              content: >-
                #faker.expression("#{date.past '1','DAYS','yyyy-MM-dd HH:mm:ss'}")

# 数据输出配置
output:
  writers:
    - type: CONSOLE