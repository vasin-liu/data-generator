# 数据集名称，各个文件中唯一
name: demo_11
#生成数量
amount: 10
#批次数量
batchSize: 5
#全局配置
global:
  #线程池配置
  executor:
    #核心线程数
    coreSize: 8
    #最大线程数
    maxSize: 16
    #队列大小
    queueCapacity: 16

# 数据集元数据配置
table:
  fields:
    - name: AREA_NAME
      stages:
        - type: READ
          dataSetId: AREA_NAME_DS_1
          inMemory: true
          readers:
            - type: JDBC
              dataSourceId: 'system_manage'
              content: "SELECT AREA_CODE,AREA_NAME,DISTRICT_CODE,DISTRICT_NAME FROM SM_AREA WHERE PARENT_CODE = '4409' LIMIT 10"
        - type: SELECT
        - type: SCRIPT
          scriptType: SPEL
          content: "#dataset.DISTRICT_CODE"
        - type: READ
          dataSetId: AREA_NAME_DS_2
          params:
            - name: districtCode
              content: "#dataset"
          readers:
            - type: JDBC
              dataSourceId: 'system_manage'
              content: "SELECT CODE,NAME,PARENT_CODE FROM PC_DISTRICT WHERE CODE = :districtCode LIMIT 10"
        - type: SELECT
        - type: SCRIPT
          scriptType: SPEL
          content: "#dataset.NAME"

# 数据输出配置
output:
  writers:
    - type: CONSOLE