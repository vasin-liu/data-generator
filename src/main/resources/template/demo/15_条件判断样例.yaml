# 数据集名称，各个文件中唯一
name: demo_15
#生成数量
amount: 10
#批次数量
batchSize: 5
#全局配置
global:
  #线程池配置
  executor:
    #核心线程数
    coreSize: 8
    #最大线程数
    maxSize: 16
    #队列大小
    queueCapacity: 16

# 数据集元数据配置
table:
  fields:
    - name: DICT
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: CONSTANT
              content: [1,2,3,NULL]
    - name: MAP_NO
      dependsOn:
        - DICT
      stages:
        - type: SELECT
        - type: CONDITION
          choose:
            - when:
                content: "#dataset==3"
              then:
                content: >-
                  #faker.datetime.plusHours(#faker.expression("#{date.past '1','DAYS','yyMMddHHmmss'}"),#dataset+1)
            - when:
                content: "#dataset==1"
              then:
                content: "#dataset+100"
            - when:
                content: "#dataset==null"
              then:
                scriptType: PLAIN
                content: ""
          otherwise:
            then:
              scriptType: PLAIN
              content: 'X'


# 数据输出配置
output:
  writers:
    - type: CONSOLE