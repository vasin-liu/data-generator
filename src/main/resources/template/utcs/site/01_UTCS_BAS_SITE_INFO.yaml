# 数据集名称，各个文件中唯一
name: utcs_bas_site_info
#生成数量
amount: 922
#批次数量
batchSize: 100
#全局配置
global:
  #线程池配置
  executor:
    #核心线程数
    coreSize: 8
    #最大线程数
    maxSize: 16
    #队列大小
    queueCapacity: 16

# 数据集元数据配置
table:
  fields:
    - name: ID
      stages:
        - type: READ
          readers:
            - type: SPEL
              content: "#faker.snowflake.next"
        - type: SELECT
    - name: SITE_CODE
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: JDBC
              dataSourceId: 'utcs_pg'
              content: "SELECT * FROM utcs_bas_siteinfo where road_name is not null and code like 'GZ%' limit 1000"
        - type: SELECT
          strategyType: ONCE_RANDOM
        - type: SCRIPT
          scriptType: SPEL
          content: "#dataset.code"
    - name: SITE_NAME
      dependsOn:
        - SITE_CODE
      stages:
        - type: SCRIPT
          scriptType: SPEL
          content: "#dataset.road_name"
    - name: DISTRICT_CODE
      dependsOn:
        - SITE_CODE
      stages:
        - type: SCRIPT
          scriptType: SPEL
          content: "#dataset.area_code"
    - name: SIGNAL_MODEL
      dependsOn:
        - SITE_CODE
      stages:
        - type: SCRIPT
          scriptType: SPEL
          content: "#dataset.supplier"
    - name: NETWORKING
      dependsOn:
        - SITE_CODE
      stages:
        - type: SCRIPT
          scriptType: SPEL
          content: "#dataset.current_state"
    - name: COMM_STATUS
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: CONSTANT
              content: [ 1,2 ]
    - name: REGION_CODE
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: CONSTANT
              content: [ 'GZ001(机动)','GZ002(机动)','GZ003(海珠)','GZ004(天河)','GZ005(芳村)','GZ006(白云一)','GZ007(机动)','GZ008(黄埔)' ]
    - name: ROAD_TYPE
      dependsOn:
        - SITE_CODE
      stages:
        - type: SCRIPT
          scriptType: SPEL
          content: "#dataset.road_level"
    - name: SITE_STATUS
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: CONSTANT
              content: [ 0,1,2,3,4 ]
    - name: COORDINATION_CONTROL
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: CONSTANT
              content: [ 0,1 ]
    - name: BRIGADE_CONTROL
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: CONSTANT
              content: [ 0,1 ]
    - name: CHANNELIZING
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: CONSTANT
              content: [ 1,2,3 ]
    - name: OPTIMIZE_NUM
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: SPEL
              content: "#faker.number.numberBetween(0,10)"
    - name: PUBLIC_OPINION_NUM
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: SPEL
              content: "#faker.number.numberBetween(0,10)"
    - name: YELLOW_CONTROL
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: CONSTANT
              content: [ 0,1 ]
    - name: STITCHES_NUM
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: SPEL
              content: "#faker.number.numberBetween(8,15)"
    - name: LONGITUDE
      dependsOn:
        - SITE_CODE
      stages:
        - type: SCRIPT
          scriptType: SPEL
          content: "#dataset.longitude"
    - name: LATITUDE
      dependsOn:
        - SITE_CODE
      stages:
        - type: SCRIPT
          scriptType: SPEL
          content: "#dataset.latitude"
    - name: STATUS
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: CONSTANT
              content: [ 'S0A' ]
    - name: CREATE_TIME
      stages:
        - type: READ
          readers:
            - type: SPEL
              content: >-
                #faker.expression("#{date.past '1','DAYS','yyyy-MM-dd HH:mm:ss'}")
    - name: CREATE_BY
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: CONSTANT
              content: [ 'admin' ]
    - name: UPDATE_TIME
      dependsOn:
        - CREATE_TIME
      stages:
        - type: SCRIPT
          scriptType: SPEL
          content: "#dataset"
    - name: UPDATE_BY
      stages:
        - type: READ
          inMemory: true
          readers:
            - type: CONSTANT
              content: [ 'admin' ]


# 数据输出配置
output:
  writers:
#    - type: CONSOLE
    - type: JDBC
      dataSourceId: 'utcs_dm'
      target: 'UTCS_BAS_SITE_INFO'
      template: >-
        ID,SITE_CODE,SITE_NAME,DISTRICT_CODE,SIGNAL_MODEL,NETWORKING,COMM_STATUS,REGION_CODE,ROAD_TYPE,SITE_STATUS,
        COORDINATION_CONTROL,BRIGADE_CONTROL,CHANNELIZING,OPTIMIZE_NUM,PUBLIC_OPINION_NUM,YELLOW_CONTROL,STITCHES_NUM,
        LONGITUDE,LATITUDE,STATUS,CREATE_TIME,CREATE_BY,UPDATE_TIME,UPDATE_BY