        name: fixture-writer-target
        type: jdbc
        url: jdbc:h2:mem:fixture_writer_basic;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
        username: sa
        password: ""
        driverClassName: org.h2.Driver
      target: fixture_export
