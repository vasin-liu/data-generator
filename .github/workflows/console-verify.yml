name: Console verify

on:
  push:
    branches: [master, main, 'feature-*']
    paths:
      - 'data-generator-console-web/**'
      - 'data-generator-service/**'
      - 'data-generator-common/**'
      - 'scripts/e2e-podman.ps1'
      - 'scripts/e2e-distributed-podman.ps1'
      - 'scripts/verify-console.ps1'
      - 'scripts/verify-console-unit.ps1'
      - 'scripts/lib/**'
      - '.github/workflows/console-verify.yml'
  pull_request:
    paths:
      - 'data-generator-console-web/**'
      - 'data-generator-service/**'
      - 'data-generator-common/**'
      - 'scripts/e2e-podman.ps1'
      - 'scripts/e2e-distributed-podman.ps1'
      - 'scripts/verify-console.ps1'
      - 'scripts/verify-console-unit.ps1'
      - 'scripts/lib/**'
      - '.github/workflows/console-verify.yml'

jobs:
  console-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: data-generator-console-web/package-lock.json

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Install PowerShell
        run: |
          sudo apt-get install -y wget apt-transport-https software-properties-common
          wget -q https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Prepare Maven wrapper
        run: chmod +x mvnw


      - name: Console verification (unit + build + UI E2E)
        run: pwsh -NoProfile -File ./scripts/verify-console.ps1
