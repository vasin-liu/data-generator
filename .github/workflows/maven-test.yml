name: Maven test

on:
  push:
    branches: [master, main, 'feature-*']
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Prepare Maven wrapper
        run: chmod +x mvnw

      - name: Build console frontend (embed prerequisite)
        run: ./mvnw -s .mvn/settings-jdk25.xml -pl data-generator-console-web -DskipTests package

      - name: Full Maven test (fail-at-end)
        run: ./mvnw -s .mvn/settings-jdk25.xml test -fae "-Dskip.console.frontend=true"
