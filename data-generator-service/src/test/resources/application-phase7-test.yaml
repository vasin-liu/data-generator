server:
  port: 0

spring:
  application:
    name: data-generator-service-phase7-test
  jpa:
    open-in-view: false
  datasource:
    dynamic:
      primary: data-generator
      datasource:
        data-generator:
          url: jdbc:h2:mem:data-generator-phase7;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
          username: sa
          password:
          driver-class-name: org.h2.Driver
          type: com.alibaba.druid.pool.DruidDataSource
          init:
            schema: classpath:db/schema.sql
        compare-inline-ds:
          url: jdbc:h2:mem:compare_migration_embedded;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
          username: sa
          password:
          driver-class-name: org.h2.Driver
          type: com.alibaba.druid.pool.DruidDataSource
      druid:
        filters: stat,slf4j
        validation-query: SELECT 1

# Phase 7 governance placeholders — dev OFF defaults for downstream IT slices (D-14).
data:
  generator:
    governance:
      require-published-for-task-run: false
      reject-plaintext-passwords-in-templates: true
      require-managed-connections: false
      require-connectivity-test-before-save: false
      allow-bootstrap-references: true
