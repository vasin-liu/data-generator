# B-lite staging overlay — combine with base application.yaml:
#   --spring.profiles.active=staging
# Enables header RBAC and publish governance for operator-console acceptance.
server:
  port: 8080

spring:
  application:
    name: data-generator-service-staging

data:
  generator:
    governance:
      require-published-for-task-run: true
      reject-plaintext-passwords-in-templates: true
      require-managed-connections: true
      require-connectivity-test-before-save: true
      require-connectivity-test-before-publish: true
      allow-bootstrap-references: true
    schedule:
      enabled: true
    console-security:
      enabled: true
      role-header: X-Console-Role
      actor-header: X-Console-Actor
