# 数据集名称，各个文件中唯一
name: demo_11
# 迭代器配置
iterator:
  type: NUMBER
  from: 1
  to: 100
  step: 1
# 生成器配置
generator:
  type: ASYNC
  batchSize: 10
  executor:
    coreSize: 8
    maxSize: 16
    queueCapacity: 8
# 数据集元数据配置
fields:
  - name: AREA_NAME
    stages:
      - type: READ
        dataSetId: AREA_NAME_DS_1
        inMemory: true
        readers:
          - type: JDBC
            dataSourceId: 'system_manage'
            content: "SELECT AREA_CODE,AREA_NAME,DISTRICT_CODE,DISTRICT_NAME FROM SM_AREA WHERE PARENT_CODE = '4409' LIMIT 10"
      - type: SELECT
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset.DISTRICT_CODE"
      - type: READ
        dataSetId: AREA_NAME_DS_2
        params:
          - name: districtCode
            language:
              content: "#dataset"
        readers:
          - type: JDBC
            dataSourceId: 'system_manage'
            content: "SELECT CODE,NAME,PARENT_CODE FROM PC_DISTRICT WHERE CODE = :districtCode LIMIT 10"
      - type: SELECT
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset.NAME"

# 数据输出配置
output:
  writers:
    - type: CONSOLE