# 数据集名称，各个文件中唯一
name: demo_18
# 迭代器配置
iterator:
  type: database
  params:
    - name: key1
      language:
        content: value1
  dataSourceId: utcs_dm
  sql: >-
    select "id","crossing_id","crossing_name","longitude","latitude" from "UTCS"."utcs_bas_siteinfo_new_temp"
  pageIndex: 1
  pageSize: 3
  maxRows: 10
  stages:
    - type: LOG
  iterator:
    type: NUMBER
    from: 1
    to: 3
    stages:
      - type: LOG
    choose:
      - when:
          type: SPEL
          content: "#dataset==2"
        then:
          type: SPEL
          content: "true"
    otherwise:
      then:
        type: SPEL
        content: "#dataset"
# 生成器配置
generator:
  type: ASYNC
  batchSize: 10
  executor:
    coreSize: 8
    maxSize: 16
    queueCapacity: 8
# 数据集元数据配置
fields:
  - name: ID
    stages:
      - type: READ
        # 读取器选择类型，可选值：EQUAL,WEIGHT
        strategy:
          type: WEIGHT
        # 内存驻留需设置为 false，默认为 false
        # inMemory: false
        readers:
          - type: SPEL
            weight: 100
            content: "#faker.snowflake.next"
          - type: SPEL
            weight: 100
            content: "#faker.common.text(9,10)"
  - name: STATUS
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content: [ 'S0A', 'S0X' ,'S0D', 'S0H' ]
      - type: SELECT
  - name: CREATE_TIME
    stages:
      - type: READ
        readers:
          - type: SPEL
            content: >-
              #faker.expression("#{date.past '1','DAYS','yyyy-MM-dd HH:mm:ss'}")

# 数据输出配置
output:
  writers:
    - type: CONSOLE