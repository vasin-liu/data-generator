# 数据集名称，各个文件中唯一
name: demo_21
# 迭代器配置
iterator:
  type: NUMBER
  from: 1
  to: 3
# 生成器配置
generator:
  type: ASYNC
  batchSize: 10
  executor:
    coreSize: 8
    maxSize: 16
    queueCapacity: 8
# 数据集元数据配置
fields:
  - name: ID
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CSV
            path: "E:\\Desktop\\temp\\1-测试数据\\路内_辖区.csv"
            endRow: 11
            custom:
              skipHeaderRecord: true

# 数据输出配置
output:
  writers:
    - type: CONSOLE