# 数据集名称，各个文件中唯一
name: demo_01
# 迭代器配置
iterator:
  type: NUMBER
  from: 1
  to: 5
  step: 1
  choose:
    - when:
        type: SPEL
        content: "#dataset==2"
      then:
        type: SPEL
        content: "true"
  otherwise:
    then:
      type: SPEL
      content: "#dataset"
  iterator:
    type: NUMBER
    from: 1
    to: 3
    step: 1
    choose:
      - when:
          type: SPEL
          content: "#dataset==2"
        then:
          type: SPEL
          content: "true"
    otherwise:
      then:
        type: SPEL
        content: "#dataset"
# 生成器配置
generator:
  type: ASYNC
  batchSize: 10
  executor:
    coreSize: 8
    maxSize: 16
    queueCapacity: 8
# 数据集元数据配置
fields:
  - name: ID
    stages:
      - type: READ
        # 读取器选择类型，可选值：EQUAL,WEIGHT
        strategy:
          type: WEIGHT
        # 内存驻留需设置为 false，默认为 false
        # inMemory: false
        readers:
          - type: SPEL
            weight: 100
            content: "#faker.snowflake.next"
          - type: SPEL
            weight: 100
            content: "#faker.common.text(9,10)"
  - name: STATUS
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content: [ 'S0A', 'S0X' ,'S0D', 'S0H' ]
      - type: SELECT
  - name: CREATE_TIME
    stages:
      - type: READ
        readers:
          - type: SPEL
            content: >-
              #faker.expression("#{date.past '1','DAYS','yyyy-MM-dd HH:mm:ss'}")

# 数据输出配置
output:
  writers:
    - type: CONSOLE