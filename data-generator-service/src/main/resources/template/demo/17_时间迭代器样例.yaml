# 生成器配置
generator:
  type: ASYNC
  batchSize: 10
  executor:
    coreSize: 8
    maxSize: 16
    queueCapacity: 8
# 数据集元数据配置
fields:
  - name: IT_DATETIME
    stages:
      - type: SELECT
      - type: SCRIPT
        language:
          type: SPEL
          content: >-
            #faker.datetime.format(#dataset[0].get(),'yyyy-MM-dd HH:mm:ss')
      - type: SELECT
  - name: IT_NUMBER
    stages:
      - type: SELECT
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset[1]"
      - type: SELECT
  - name: CONCAT
    dependsOn:
      - IT_DATETIME
      - IT_NUMBER
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: >-
            #faker.datetime.format(#dataset[0],'yyyyMMddHHmmss') + '-' + #dataset[1]
  - name: CREATE_TIME
    stages:
      - type: READ
        readers:
          - type: SPEL
            content: >-
              #faker.expression("#{date.past '1','DAYS','yyyy-MM-dd HH:mm:ss'}")

# 数据输出配置
output:
  writers:
    - type: CONSOLE