# definitionKind: V2
# scenarioId: GF-DAG-FANOUT
# catalogRef: WF-03 — L1 transform DAG fan-out from one upstream node
name: scenario-dag-fanout
workflow:
  steps:
    - type: invoke_compute_block
      id: invoke-fanout
      computeBlockId: fanout-block
computeBlocks:
  - id: fanout-block
    sources:
      seed:
        type: iterator
        iterator:
          type: number
          from: 1
          to: 3
          step: 1
    transformGraph:
      transforms:
        base-pass:
          type: sql
          name: base-pass
          sql: SELECT value FROM seed
        add-tag:
          type: sql
          name: add-tag
          sql: SELECT value, value + 100 AS tagged FROM input
        double-val:
          type: sql
          name: double-val
          sql: SELECT value, value * 2 AS doubled FROM input
      nodes:
        - id: n1
          transformId: base-pass
          outputAlias: base
        - id: n2
          transformId: add-tag
          outputAlias: tagged
        - id: n3
          transformId: double-val
          outputAlias: output
      edges:
        - fromNodeId: n1
          fromPort: out
          toNodeId: n2
          toPort: in
        - fromNodeId: n1
          fromPort: out
          toNodeId: n3
          toPort: in
