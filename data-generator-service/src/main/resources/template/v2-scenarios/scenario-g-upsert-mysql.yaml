# definitionKind: V2
# scenarioId: GF-G
# catalogRef: RW-03 — CHUNKED JDBC upsert (MySQL dialect, H2 MODE=MySQL in IT)
name: scenario-g-upsert-mysql
executionPolicy:
  mode: CHUNKED
  sourceChunkSize: 40
  sinkBatchSize: 40
  maxTotalRows: 40
  maxRowsInMemory: 100
sources:
  orders:
    type: query
    dataSource:
      name: gf-g-upsert-mysql-source
      type: jdbc
      url: jdbc:h2:mem:gf_g_upsert_mysql_src;MODE=MySQL;DB_CLOSE_DELAY=-1
      username: sa
      password: ""
      driverClassName: org.h2.Driver
    sql: SELECT id, name FROM gf_upsert_source ORDER BY id
transform:
  type: sql
  sql: SELECT id, name FROM orders
sink:
  writers:
    - type: jdbc
      dataSource:
        name: gf-g-upsert-mysql-target
        type: jdbc
        url: jdbc:h2:mem:gf_g_upsert_mysql_tgt;MODE=MySQL;DB_CLOSE_DELAY=-1
        username: sa
        password: ""
        driverClassName: org.h2.Driver
      target: gf_upsert_target
      options:
        dialect: mysql
        upsert: true
        upsertKeys:
          - id
