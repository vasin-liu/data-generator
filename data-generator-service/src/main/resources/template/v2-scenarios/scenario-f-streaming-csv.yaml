# definitionKind: V2
# scenarioId: GF-F
# catalogRef: RW-01 — CSV streaming source, SQL transform, console sink
name: scenario-f-streaming-csv
executionPolicy:
  mode: STREAMING
  sourceChunkSize: 40
  sinkBatchSize: 40
  maxTotalRows: 120
  maxRowsInMemory: 200
sources:
  incoming:
    type: csv
    path: template/v2-scenarios/fixtures/streaming-orders.csv
    header: true
transform:
  type: sql
  sql: SELECT order_id, UPPER(customer) AS customer, amount FROM incoming
sink:
  writers:
    - type: console
