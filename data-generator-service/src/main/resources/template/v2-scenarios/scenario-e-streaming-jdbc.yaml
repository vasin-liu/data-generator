# definitionKind: V2
# scenarioId: GF-E
# catalogRef: CV-02 — query-backed JDBC export with STREAMING execution
name: scenario-e-streaming-jdbc
executionPolicy:
  mode: STREAMING
  sourceChunkSize: 40
  sinkBatchSize: 40
  maxTotalRows: 160
  maxRowsInMemory: 400
sources:
  ledger:
    type: query
    dataSource:
      name: gf-e-source
      type: jdbc
      url: jdbc:h2:mem:gf_e_source;MODE=MySQL;DB_CLOSE_DELAY=-1
      username: sa
      password: ""
      driverClassName: org.h2.Driver
    sql: SELECT id, label FROM gf_ledger ORDER BY id
transform:
  type: sql
  sql: SELECT id, label FROM ledger
sink:
  writers:
    - type: jdbc
      dataSource:
        name: gf-e-target
        type: jdbc
        url: jdbc:h2:mem:gf_e_target;MODE=MySQL;DB_CLOSE_DELAY=-1
        username: sa
        password: ""
        driverClassName: org.h2.Driver
      target: gf_ledger_export
