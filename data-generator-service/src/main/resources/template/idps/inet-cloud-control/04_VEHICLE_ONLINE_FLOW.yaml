  - name: ID
    stages:
      - type: READ
        readers:
          - type: SPEL
            content: "#faker.snowflake.next"
      - type: SELECT
  - name: OPERATOR_ID
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content: [ '123456' ]
  - name: STAT_TIME
    stages:
      - type: READ
        readers:
          - type: SPEL
            content: >-
              #faker.expression("#{date.past '1','DAYS','yyyy-MM-dd HH:mm:ss'}")
  - name: PLATE_NUMBER
    dependsOn:
      - VEHICLES
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset.PLATE_NUMBER"
  - name: PLATE_TYPE
    dependsOn:
      - VEHICLES
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset.PLATE_TYPE"
  - name: ONLINE_STATUS
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content: [ 0,1 ]
  - name: CREATE_TIME
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#faker.datetime.now()"
  - name: UPDATE_TIME
    dependsOn:
      - CREATE_TIME
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset"

# 数据输出配置
output:
  writers:
#    - type: CONSOLE
    - type: JDBC
      dataSourceId: 'inet_cloud_ctrl'
      target: 'VEHICLE_ONLINE_FLOW'
      template: >-
        ID,OPERATOR_ID,STAT_TIME,PLATE_NUMBER,PLATE_TYPE,ONLINE_STATUS,CREATE_TIME,UPDATE_TIME