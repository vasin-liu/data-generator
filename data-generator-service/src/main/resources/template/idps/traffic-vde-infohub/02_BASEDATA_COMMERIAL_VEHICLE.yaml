# 生成器配置
generator:
  type: ASYNC
  batchSize: 10
  executor:
    coreSize: 8
    maxSize: 16
    queueCapacity: 8
# 数据集元数据配置
fields:
  - name: ID
    stages:
      - type: READ
        readers:
          - type: SPEL
            content: "#faker.snowflake.next"
      - type: SELECT
  - name: PLATE_NUMBER
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset[0].PLATE_NUMBER"
  - name: PLATE_TYPE
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset[0].PLATE_TYPE"
  - name: PLATE_COLOR
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content: [ 42 ]
  - name: VEHICLE_COLOR
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset[0].VEHICLE_COLOR"
  - name: VEHICLE_COMPUTER_NUMBER
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset[0].VEHICLE_ID"
  - name: COMPUTER_NUMBER
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset[0].VEHICLE_ID"
  - name: COMPANY_NAME
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset[0].COMPANY"
  - name: STATE
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content: [ 1 ]
  - name: CREATE_TIME
    stages:
      - type: READ
        readers:
          - type: SPEL
            content: >-
              #faker.datetime.now()
  - name: UPDATE_TIME
    dependsOn:
      - CREATE_TIME
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset"

# 数据输出配置
output:
  writers:
#    - type: CONSOLE
    - type: JDBC
      dataSourceId: 'traffic_vde_infohub'
      target: 'BASEDATA_COMMERIAL_VEHICLE'
      template: >-
        ID,PLATE_NUMBER,PLATE_TYPE,PLATE_COLOR,VEHICLE_COLOR,VEHICLE_COMPUTER_NUMBER,COMPUTER_NUMBER,COMPANY_NAME,STATE,CREATE_TIME,UPDATE_TIME