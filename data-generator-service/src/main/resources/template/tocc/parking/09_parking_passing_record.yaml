# 生成器配置
generator:
  type: SYNC
  batchSize: 10
# 数据集元数据配置
fields:
#  - name: PARKING_LOT
#    stages:
#      - type: READ
#        inMemory: true
#        readers:
#          - type: CONSTANT
#            content: [
#              { "ID": "1902630276017287170","NAME": "宝墨园停车场","SPACE": 1639 },
#              { "ID": "1904364811469844481","NAME": "沙湾古镇西2停车场","SPACE": 25 },
#              { "ID": "1904365783499796482","NAME": "沙湾古镇东停车场","SPACE": 270 },
#              { "ID": "1904366257288376321","NAME": "沙湾古镇南停车场","SPACE": 191 },
#              { "ID": "1904373219975622658","NAME": "紫泥堂停车场","SPACE": 228 },
#            ]
#      - type: SELECT
#        strategy:
#          type: MULTIPLE_ORDER
#          minTimes: 2
#          maxTimes: 2
  - name: ID
    stages:
      - type: READ
        readers:
          - type: SPEL
            content: >-
              #faker.snowflake.next
      - type: SELECT
  - name: PARKING_LOT_ID
#    dependsOn:
#      - PARKING_LOT
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: >-
            #dataset[2]['ID']
      - type: SELECT
  - name: PARKING_LOT_NAME
#    dependsOn:
#      - PARKING_LOT
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: >-
            #dataset[2]['PARKING_LOT_NAME']
      - type: SELECT
  - name: PLATE_NUMBER
    stages:
      - type: SELECT
      - type: SCRIPT
        language:
          type: SPEL
          content: >-
            #dataset[0]['HPHM']
  - name: PLATE_COLOR
    stages:
      - type: SELECT
      - type: SCRIPT
        language:
          type: SPEL
          content: >-
            #dataset[0]['HPYS']
  - name: VEHICLE_COLOR
    stages:
      - type: SELECT
      - type: SCRIPT
        language:
          type: SPEL
          content: >-
            #dataset[0]['CSYS']
  - name: PASS_TIME
    stages:
      - type: READ
        readers:
          - type: SPEL
            content: >-
              #faker.datetime.plusHours((#dataset[1].get()-1)*#faker.number.numberBetween(2,10))
  - name: PASS_TYPE
    stages:
      - type: SELECT
      - type: SCRIPT
        language:
          type: SPEL
          content: >-
            #dataset[1]
  - name: PASS_PIC
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content:
              - "http://172.25.21.133:8088/simulation/pic/g1/M00/00011001/20200225/LDpT4l5U3CKIOctXAAAvpaTsytQAADzngPYf8wAAC-9855.jpg"
  - name: STATUS
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content: [ 'S0A' ]
  - name: CREATE_TIME
    dependsOn:
      - PASS_TIME
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset"
  - name: UPDATE_TIME
    dependsOn:
      - PASS_TIME
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset"

