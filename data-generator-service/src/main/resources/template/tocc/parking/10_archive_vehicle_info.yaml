  ]
# 生成器配置
generator:
  type: ASYNC
  batchSize: 10
  executor:
    coreSize: 8
    maxSize: 16
    queueCapacity: 8
# 数据集元数据配置
fields:
  - name: ID
    stages:
      - type: READ
        readers:
          - type: SPEL
            content: "#faker.snowflake.next"
      - type: SELECT
  - name: VEHICLE_ID
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: >-
            #dataset.HPHM + '_' + #dataset.HPYS
  - name: PLATE_NUMBER
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: >-
            #dataset[0].HPHM
  - name: PLATE_COLOR
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: >-
            #dataset[0].HPYS
  - name: PLATE_TYPE
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: >-
            #dataset[0].HPZL
  - name: VEHICLE_TYPE
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: >-
            #dataset[0].CLLX
  - name: VEHICLE_COLOR
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: >-
            #dataset[0].CSYS
  - name: CAR_LOGO
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: >-
            #dataset[0].CAR_LOGO
  - name: PHONE
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: >-
            #dataset[0].PHONE
  - name: ARCHIVE_STATUS
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content: [ 1 ]
  - name: STATUS
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content: [ 'S0A' ]
  - name: CREATE_TIME
    stages:
      - type: READ
        readers:
          - type: SPEL
            content: >-
              #faker.expression("#{date.past '1','DAYS','yyyy-MM-dd HH:mm:ss'}")
  - name: UPDATE_TIME
    dependsOn:
      - CREATE_TIME
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset"


# 数据输出配置
output:
  writers:
#    - type: CONSOLE
    - type: JDBC
      dataSourceId: 'tocc_parking'
      target: 'ARCHIVE_VEHICLE_INFO'
      template: >-
        ID,VEHICLE_ID,PLATE_NUMBER,PLATE_COLOR,PLATE_TYPE,VEHICLE_TYPE,VEHICLE_COLOR,CAR_LOGO,PHONE,
        ARCHIVE_STATUS,STATUS,CREATE_TIME,UPDATE_TIME