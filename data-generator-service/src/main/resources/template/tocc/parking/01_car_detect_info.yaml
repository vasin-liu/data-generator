    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content: [ 0,1,99 ]
  - name: IS_RENEWAL
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content: [ 0 ]
