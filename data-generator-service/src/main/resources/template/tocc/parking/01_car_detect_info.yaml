    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset"
  - name: PRE_HPHM
    dependsOn:
      - HPHM
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset"
  - name: PRE_HPYS
    dependsOn:
      - HPYS
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset"
  - name: PRE_CAR_SERIES
    dependsOn:
      - CAR_SERIES
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset"
  - name: PRE_CAR_YEAR
    dependsOn:
      - CAR_YEAR
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset"
  - name: THIRD_ID
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content: [ '' ]
  - name: THIRD_SRC
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content: [ 0 ]
  - name: RLTZ
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content: [ 0,1,99 ]
  - name: RELATED_LIST
