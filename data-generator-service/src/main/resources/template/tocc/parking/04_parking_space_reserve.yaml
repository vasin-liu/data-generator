  ]
# 生成器配置
generator:
  type: ASYNC
  batchSize: 10
  executor:
    coreSize: 8
    maxSize: 16
    queueCapacity: 8
# 数据集元数据配置
fields:
  - name: ID
    stages:
      - type: READ
        readers:
          - type: SPEL
            content: "#faker.snowflake.next"
      - type: SELECT
  - name: PARKING_LOT_ID
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: JDBC
            dataSourceId: 'tocc_parking'
            content: "SELECT ID,PARKING_LOT_NAME FROM TOCC_PARKING_LOT.PARKING_LOT_BASE WHERE STATUS = 'S0A' LIMIT 20"
      - type: SELECT
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset.ID"
  - name: PARKING_LOT_NAME
    dependsOn:
      - PARKING_LOT_ID
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset.PARKING_LOT_NAME"
  - name: PLATE_NUMBER
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset[0]['HPHM']"
  - name: PLATE_COLOR
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset[0].HPYS"
  - name: PLATE_TYPE
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset[0].HPZL"
  - name: PHONE
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset[0].PHONE"
  - name: RECEIVE_PHONE
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset[0].PHONE"
  - name: RESERVE_DATE
    stages:
      - type: READ
        readers:
          - type: SPEL
            content: >-
              #faker.expression("#{date.past '1','DAYS','yyyy-MM-dd'}")
  - name: START_TIME
    stages:
      - type: READ
        readers:
          - type: SPEL
            content: >-
              #faker.datetime.parse(#faker.expression("#{date.past '1','DAYS','yyyy-MM-dd HH:mm:ss'}"))
  - name: END_TIME
    dependsOn:
      - START_TIME
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: >-
            #faker.datetime.format(#dataset)
      - type: SCRIPT
        language:
          type: SPEL
          content: >-
            #faker.datetime.parse(#faker.datetime.afterMinutes(#dataset,30,120))
  - name: EXTENSION_TIMES
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content: [ 0,1 ]
  #    - name: EXTENSION_END_TIME
  #      stages:
  #        - type: READ
  #          inMemory: true
  #          readers:
  #            - type: CONSTANT
  #              content: [ ]
  #    - name: CANCEL_TIME
  #      stages:
  #        - type: READ
  #          inMemory: true
  #          readers:
  #            - type: CONSTANT
  #              content: [ ]
  - name: RESERVE_STATUS
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content: [ 0,1,2 ]
  - name: STATUS
    stages:
      - type: READ
        inMemory: true
        readers:
          - type: CONSTANT
            content: [ 'S0A' ]
  - name: CREATE_TIME
    stages:
      - type: READ
        readers:
          - type: SPEL
            content: >-
              #faker.expression("#{date.past '1','DAYS','yyyy-MM-dd HH:mm:ss'}")
  - name: UPDATE_TIME
    dependsOn:
      - CREATE_TIME
    stages:
      - type: SCRIPT
        language:
          type: SPEL
          content: "#dataset"


# 数据输出配置
output:
  writers:
    #    - type: CONSOLE
    - type: JDBC
      dataSourceId: 'tocc_parking'
      target: 'PARKING_SPACE_RESERVE'
      template: >-
        ID,PARKING_LOT_ID,PARKING_LOT_NAME,PLATE_NUMBER,PLATE_COLOR,PLATE_TYPE,RESERVE_DATE,START_TIME,END_TIME,PHONE,
        RECEIVE_PHONE,RESERVE_STATUS,STATUS,CREATE_TIME,UPDATE_TIME